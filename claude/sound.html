<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="חמש השאלות">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>חמש השאלות של הצליל · גרסת קלוד</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="doors.css?v=8">
<style>
/* Five questions of sound: every sound is pitch, color, shape in time, movement, space and dirt.
   Each question: "see" (one small simulation you can touch and hear) and "play" (short missions on any real device).
   Built: color (the filter) and movement (filter envelope, accent, glide, slow oscillator). Same shell as week.html (doors.css, own colors, no doors.js). Saved under sound1. */
:root{--bg:#111818;--panel:#182222;--card:#1f2b2b;--line:#33474a;
  --magenta:#1fa39a;--magenta-soft:#173a37;--chipline:#2f6f69;--chipfg:#cff5f0}
.chips{justify-content:flex-start}
.chip.soon{opacity:.55}
.helpbtn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.9rem}
.scope{background:#0b1111;border:1px solid var(--line);border-radius:14px;padding:8px}
.scope canvas{display:block;width:100%;height:150px}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;padding:2px 4px 0;direction:ltr}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl .top b{font-size:1rem}
.ctl .top span{color:var(--muted);font-size:.85rem}
input[type=range]{width:100%;accent-color:var(--magenta);height:34px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border-radius:999px;padding:10px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.seg button.on{background:var(--magenta-soft);border-color:var(--magenta);color:var(--chipfg)}
.play.on{background:#3a2a1a;color:var(--gold)}
.knobs{width:100%;border-collapse:collapse;font-size:.95rem}
.knobs td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
.knobs tr:first-child td{border-top:0}
.knobs td:first-child{color:var(--muted);padding-inline-end:6px}
.knobs .en{white-space:normal}
.mis{display:flex;flex-direction:column;gap:6px}
.mis h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.25rem}
.mis ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.mis .ear{color:var(--chipfg);font-size:.95rem}
.mis .okb{align-self:flex-start;border-radius:999px;padding:8px 14px;font-weight:700;border:1px solid var(--line);background:var(--panel)}
.mis .okb.on{background:#1f3a2b;border-color:var(--green);color:var(--green)}
.mis.done{border-color:var(--green)}
.qrow{display:flex;gap:10px;align-items:baseline}
.qrow b{flex:none;min-width:5.6em}
.qrow span{color:var(--muted)}
.sheet p{margin:0}
.devk{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.devk:first-of-type{border-top:0}
.devk>b{font-size:.95rem}
.devk span{color:var(--muted);font-size:.92rem}
.devk span .en{color:var(--fg);white-space:normal}
.steps{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;direction:ltr;margin-top:6px}
.steps i{font-style:normal;text-align:center;font-size:.72rem;color:var(--muted);border-radius:4px;padding:2px 0;background:#152020}
.steps i.a{color:var(--gold);background:#2e2a1c}
.steps i.g{color:var(--chipfg);background:var(--magenta-soft)}
.steps i.r{opacity:.35}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog button{border-radius:999px;padding:10px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.tog button.on{background:var(--magenta-soft);border-color:var(--magenta);color:var(--chipfg)}
</style>
</head>
<body>
<div class="bar">
  <a href="index.html">→ הבית</a>
  <h1>חמש השאלות</h1>
  <button class="helpbtn" id="help">❓ מה זה</button>
</div>
<div class="chips" id="chips" role="tablist" aria-label="השאלות"></div>

<main>
  <section class="view" id="v-see"><div class="scroll"><div class="inner" id="see"></div></div></section>
  <section class="view" id="v-play"><div class="scroll"><div class="inner" id="play"></div></div></section>
</main>

<nav class="tabs" role="tablist">
  <button data-v="see"><span>👀</span>לראות</button>
  <button data-v="play"><span>🎛️</span>לשחק</button>
</nav>

<div class="shade" id="shade"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
const en=s=>`<span class="en">${s}</span>`;
/* ---------- the five questions. Built so far: color (2026-11-26), movement (2026-11-26). ---------- */
const Q=[
 {k:"pitch",e:"🎵",n:"גובה",q:"כמה גבוה או נמוך?",who:"המתנד והכיוון"},
 {k:"color",e:"🎨",n:"צבע",q:"כמה בהיר, כהה או צורם?",who:"צורת הגל והמסנן",built:true},
 {k:"time",e:"⏳",n:"צורה בזמן",q:"איך הצליל נולד ואיך הוא מת?",who:"המעטפת"},
 {k:"move",e:"🌊",n:"תנועה",q:"מה זז בתוך הצליל לבד?",who:"מעטפת על המסנן, הדגשה, גלישה, מתנד איטי",built:true},
 {k:"space",e:"🌫️",n:"מרחב ולכלוך",q:"איפה הצליל עומד, ועד כמה הוא נקי?",who:"עיוות, השהיה, הד"}
];
const qi=k=>Q.findIndex(q=>q.k===k)+1;
/* knob names exactly as printed on each panel (from the *-data.js names) */
const KNOBS=[
 ["🥁 הטי־8 (הבס)",[en("CUTOFF"),en("RESO"),en("ENV MOD")]],
 ["🎛️ הוולקה בס",[en("CUTOFF"),en("PEAK"),en("CUTOFF EG INT")]],
 ["🧡 הכתום",[en("CUTOFF"),en("RESONANCE"),en("VCF MOD")]],
 ["💗 הסגול",[en("CUTOFF"),en("RESONANCE"),en("ENVELOPE (VCF)")]]
];
const MOVEK=[
 ["🥁 הטי־8 (הבס)",[["״וואו״",en("ENV MOD")],["אורך",en("DECAY")+" של הבס"],["הדגשה",en("ACCENT")+" ובצעדים"],["גלישה",en("SLIDE")+" בצעד"]]],
 ["🎛️ הוולקה בס",[["״וואו״",en("CUTOFF EG INT")],["אורך",en("DECAY/RELEASE")],["גלישה",en("FUNC")+" + "+en("STEP MODE")],["מתנד איטי",en("RATE")+" ו־"+en("INT")]]],
 ["🧡 הכתום",[["״וואו״",en("VCF MOD")+", כש־"+en("MOD SOURCE (VCF)")+" על "+en("ENV")],["אורך",en("DECAY")],["הדגשה",en("RESET/ACCENT")+" בהקלטה"],["גלישה",en("GLIDE")],["מתנד איטי",en("LFO RATE")+", ו־"+en("MOD SOURCE (VCF)")+" על "+en("LFO")]]],
 ["💗 הסגול",[["״וואו״",en("ENVELOPE (VCF)")],["אורך",en("DECAY (VCF)")]]]
];
/* missions: [title, steps, what to listen for]. Any device. */
const MIS={
 color:[
 ["מעמום לבהיר",["קו אחד רץ. לא נוגעים בתווים.","בהירות לגמרי שמאלה.","מסובבים ימינה לאט, במשך 8 תיבות, עד הסוף."],
  "איפה בדרך הצליל ״נפתח״? זו השעה שבה הכפתור הכי חי אצלך."],
 ["הצפצוף רודף אחרי היד",["בהירות באמצע.","צפצוף עולה לאט, עד שנשמע ציוץ.","עכשיו מזיזים שוב את הבהירות, למעלה ולמטה."],
  "הציוץ זז יחד עם הבהירות. ככה נשמע אסיד: צפצוף גבוה, ויד על הבהירות."],
 ["שלושה צבעים מאותו קו",["מוצאים צבע עמוק וכהה, ורושמים את השעות.","מוצאים צבע אסיד: באמצע, עם צפצוף.","מוצאים צבע צורם ופתוח לגמרי."],
  "אותם תווים בדיוק, ושלושה צלילים שונים. רק צבע השתנה."],
 ["המסנן מפנה מקום",["תופים ובס מנגנים יחד.","סוגרים את הבהירות של הבס עד שהוא עמום.","פותחים בחזרה."],
  "כשהבס עמום, המצילות והקלאפ פתאום ברורים. בס פתוח ממלא את כל המקום למעלה."],
 ["להעלים בלי ווליום",["בשבירה, סוגרים את הבהירות לאט עד שהכלי כמעט נעלם.","לפני החזרה, פותחים בבת אחת על ה־1."],
  "הכלי לא שקט, הוא רחוק. זה כלי לבנות מתח בלי לגעת בעוצמה."]],
 move:[
 ["״וואו״ בכל תו",["בהירות כמעט סגורה, צפצוף באמצע.","מעלים את ה״וואו״ לאט, מאפס עד הסוף."],
  "כל תו נפתח ונסגר לבד, בלי שנגעת בבהירות. זה מעטפת שמזיזה את המסנן."],
 ["בלופ או וואאו",["״וואו״ באמצע.","אורך לגמרי שמאלה, ואז לאט ימינה."],
  "אורך קצר: ״בלופ״ קצבי. אורך ארוך: ״וואאו״ שנמרח. זה ההבדל בין אסיד קופצני לאסיד שמתייבב."],
 ["שתי הדגשות ברצף",["מסמנים הדגשה בשני צעדים צמודים.","מקשיבים לשני התווים."],
  "התו המודגש חזק ופתוח יותר. במכשיר שמחקה את ה־303 השני נפתח עוד יותר מהראשון. בכתום ובטי־8 נסה ותשמע אם זה קורה."],
 ["גלישה בין רחוקים",["שני תווים במרחק אוקטבה, זה אחרי זה.","גלישה ביניהם. בכתום: כפתור הגלישה לשעה 11."],
  "המעבר ״נמרח״ כמו גומייה. בסגול אין גלישה, אז שם מדלגים על המשימה."],
 ["תנועה איטית",["בוולקה בס או בכתום: מתנד איטי על המסנן, לאט.","בטי־8 ובסגול אין מתנד איטי: אותו דבר ביד, סיבוב אחד כל 8 תיבות."],
  "הצליל נפתח ונסגר על פני כמה תיבות. ככה נבנות הסוויפים הארוכים של טרנס."]]
};

/* ---------- state ---------- */
const KEY="sound1",$=s=>document.querySelector(s);
let st;try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!st||typeof st!=="object")st={};
if(!Q.find(q=>q.k===st.q&&q.built))st.q="color";
st.tab=st.tab||"see";st.wave=st.wave||"saw";
if(!st.done||typeof st.done!=="object")st.done={};
if(Object.keys(st.done).some(k=>/^\d+$/.test(k))){const o={};Object.keys(st.done).forEach(k=>o[/^\d+$/.test(k)?"color:"+k:k]=1);st.done=o}
if(st.cut===undefined)st.cut=55;if(st.res===undefined)st.res=20;
const M=st.mv=Object.assign({cut:22,res:60,env:60,dec:35,acc:true,gl:true},st.mv||{});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};

/* ---------- drawing ---------- */
function drawChips(){
  $("#chips").innerHTML=Q.map(q=>`<button class="chip${q.built?"":" soon"}" role="tab" data-q="${q.k}" aria-selected="${q.k===st.q}">${q.e} ${q.n}</button>`).join("");
  document.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>{const q=Q.find(x=>x.k===b.dataset.q);
    if(!q.built){soon(q);return}if(q.k===st.q)return;stop();st.q=q.k;save();drawChips();drawSee();drawPlay();go(st.tab)});
  const on=document.querySelector("#chips .chip[aria-selected=true]");if(on)on.scrollIntoView({inline:"center",block:"nearest"});
}
const slider=(id,name,val)=>`<div class="ctl"><div class="top"><b>${name}</b><span id="${id}O"></span></div>
<input type="range" id="${id}" min="0" max="100" step="1" value="${val}" aria-label="${name}"></div>`;
function drawSee(){
  if(st.q==="move"){drawSeeMove();return}
  $("#see").innerHTML=`<span class="tag">שאלה ${qi("color")} מתוך 5 · 🎨 צבע</span>
<h2>כמה בהיר או כהה?</h2>
<p class="lead">כל צליל הוא תו אחד, ועוד הרבה צלילים גבוהים וחלשים מעליו. ככל שיש יותר מהם, הצליל בהיר וצורם. המסנן מוריד אותם מלמעלה.</p>
<div class="scope"><canvas id="spec" aria-label="העמודות: התו והצלילים שמעליו. הקו: המסנן"></canvas>
<div class="axis"><span>התו</span><span>גבוהים יותר ←</span></div></div>
<button class="big play" id="playbtn">▶ להשמיע קו</button>
<div class="seg" id="wave"><button data-w="saw">מסור · עשיר</button><button data-w="sq">ריבוע · חלול</button></div>
${slider("cut","בהירות",st.cut)}${slider("res","צפצוף",st.res)}
<div class="box hear"><strong class="h">👂 להקשיב ל</strong>כשסוגרים בהירות, העמודות הגבוהות נעלמות והצליל עמום. כשמעלים צפצוף, העמודות ליד הקו קופצות למעלה: זה הציוץ.</div>
<div class="box"><strong class="h">💡 לזכור</strong>צבע הוא לא עוצמה. סוגרים את המסנן והצליל נשמע רחוק, בלי לגעת בווליום.</div>
<p class="back">במסור יש כל הצלילים שמעל התו, ובריבוע רק כל שני. לכן הריבוע נשמע חלול.</p>`;
  $("#cut").oninput=e=>{st.cut=+e.target.value;save();apply()};
  $("#res").oninput=e=>{st.res=+e.target.value;save();apply()};
  document.querySelectorAll("#wave button").forEach(b=>b.onclick=()=>{st.wave=b.dataset.w;save();apply()});
  $("#playbtn").onclick=toggle;
  apply();
}
function drawSeeMove(){
  $("#see").innerHTML=`<span class="tag">שאלה ${qi("move")} מתוך 5 · 🌊 תנועה</span>
<h2>מה זז בתוך הצליל לבד?</h2>
<p class="lead">בשאלת הצבע היד שלך הזיזה את המסנן. כאן הוא זז לבד: בכל תו הוא נפתח ונסגר, תו מודגש נפתח יותר, ובגלישה התו נמרח לתו הבא.</p>
<div class="scope"><canvas id="mov" aria-label="הקו: איפה המסנן לאורך תיבה אחת. מתחת: 16 הצעדים"></canvas>
<div class="steps" id="steps"></div></div>
<button class="big play" id="playbtn">▶ להשמיע קו</button>
${slider("menv","״וואו״ בכל תו",M.env)}${slider("mdec","אורך ה״וואו״",M.dec)}
<div class="tog"><button id="macc">⭐ הדגשה</button><button id="mgl">〰️ גלישה</button></div>
${slider("mcut","בהירות (נקודת המוצא)",M.cut)}
<div class="box hear"><strong class="h">👂 להקשיב ל</strong>כבה ״וואו״ ושמע קו שטוח. העלה אותו, וכל תו מתחיל לדבר. בשני הכוכבים הצמודים, השני נפתח יותר מהראשון.</div>
<div class="box"><strong class="h">💡 לזכור</strong>תנועה היא מה שהופך לולאה של 16 צעדים לחיה. אותם תווים, ובכל פעם הצליל זז אחרת.</div>
<p class="back">הכוכב השני נפתח יותר כי הדגשה משאירה ״שארית״ שלא מספיקה להתרוקן, כמו הקבל בדלי. ככה בנוי ה־303.</p>`;
  const bind=(id,k)=>$("#"+id).oninput=e=>{M[k]=+e.target.value;save();apply()};
  bind("menv","env");bind("mdec","dec");bind("mcut","cut");
  $("#macc").onclick=()=>{M.acc=!M.acc;save();apply()};
  $("#mgl").onclick=()=>{M.gl=!M.gl;save();apply()};
  $("#playbtn").onclick=toggle;
  apply();
}
function knobBox(){
  if(st.q==="move")return `<div class="box"><strong class="h">🧭 איפה זה אצלך</strong>
${MOVEK.map(r=>`<div class="devk"><b>${r[0]}</b>${r[1].map(x=>`<span>${x[0]}: ${x[1]}</span>`).join("")}</div>`).join("")}
<p class="back" style="margin-top:6px">מה שחסר במכשיר, פשוט אין בו. הבהירות והצפצוף נשארים כמו בשאלת הצבע.</p></div>`;
  return `<div class="box"><strong class="h">🧭 איפה זה אצלך</strong>
<table class="knobs"><tr><td></td><td><b>בהירות</b></td><td><b>צפצוף</b></td></tr>
${KNOBS.map(r=>`<tr><td>${r[0]}</td><td>${r[1][0]}</td><td>${r[1][1]}</td></tr>`).join("")}</table>
<p class="back" style="margin-top:6px">בסגול, המתג ${en("VCF")} בוחר אם המסנן מוריד את הגבוהים או את הנמוכים.</p></div>`;
}
function drawPlay(){
  const q=Q.find(x=>x.k===st.q),list=MIS[st.q];
  $("#play").innerHTML=`<span class="tag">${q.e} ${q.n} · על המכשיר</span>
<h2>משימות של 5 דקות</h2>
<p class="lead">כל משימה עובדת על כל מכשיר. כפתור אחד בכל פעם, ומקשיבים.</p>
${knobBox()}
${list.map((m,i)=>{const k=st.q+":"+i,d=!!st.done[k];return `<div class="box mis${d?" done":""}"><h3>${i+1}. ${m[0]}</h3><ol>${m[1].map(s=>`<li>${s}</li>`).join("")}</ol>
<p class="ear" style="margin:0">👂 ${m[2]}</p><button class="okb${d?" on":""}" data-k="${k}">${d?"✓ עשיתי":"✓ סמן שעשיתי"}</button></div>`}).join("")}
${st.q==="color"?`<p class="back">את ${KNOBS.map(r=>r[1][2]).join(" / ")} (״וואו״ בכל תו) מורידים כך שלא ישפיע. הוא שייך לשאלת התנועה.</p>`:""}`;
  document.querySelectorAll(".okb").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(st.done[k])delete st.done[k];else st.done[k]=1;save();drawPlay()});
}

/* ---------- the filter math, shared by the pictures and the sound ---------- */
const F0=110,NH=32;
const hzOf=v=>80*Math.pow(2,v/100*Math.log2(5000/80));
const qOfR=r=>0.7+Math.pow(r/100,1.6)*17;
const cutHz=()=>hzOf(st.cut),qOf=()=>qOfR(st.res);
function mag(f,fc,q){const r=f/fc;return 1/Math.sqrt(Math.pow(1-r*r,2)+Math.pow(r/q,2))}
const db=a=>Math.max(0,Math.min(1.25,(20*Math.log10(a)+42)/42));
function drawSpec(){
  const c=$("#spec");if(!c||!c.clientWidth)return;const W=c.width=c.clientWidth*2,H=c.height=300,x=c.getContext("2d");
  const fc=cutHz(),q=qOf(),bw=W/NH,base=H-8,top=40;
  x.clearRect(0,0,W,H);
  for(let n=1;n<=NH;n++){
    const a=(st.wave==="sq"&&n%2===0)?0:1/n;if(!a)continue;
    const v=db(a*mag(F0*n,fc,q)),h=v*(base-top);
    x.fillStyle=v>0.02?"#1fa39a":"#33474a";x.fillRect((n-1)*bw+bw*0.18,base-h,bw*0.64,Math.max(2,h));
  }
  x.strokeStyle="#f2c94c";x.lineWidth=4;x.beginPath();
  for(let i=0;i<=W;i+=4){const f=F0*(i/bw+0.5);const y=base-db(mag(f,fc,q))*(base-top);i?x.lineTo(i,y):x.moveTo(i,y)}
  x.stroke();
}

/* ---------- the line: 16 steps at 132. 0 = rest. Accents on 3, 4 (side by side) and 11; glides out of 7 and 12. ---------- */
const LINE=[55,55,110,55,0,55,82.41,55,55,0,110,98,55,55,73.42,55];
const ACC=[2,3,10],GL=[6,11],BPM=132,SD=60/BPM/4;
/* one bar of movement: per step, does the filter envelope restart, how many octaves it opens, does the pitch glide in */
function plan(){
  const out=[];let charge=0;
  for(let i=0;i<16;i++){
    const f=LINE[i],acc=M.acc&&ACC.indexOf(i)>=0&&f>0,glIn=M.gl&&i>0&&GL.indexOf(i-1)>=0&&f>0&&LINE[i-1]>0;
    charge*=Math.exp(-SD/0.25);
    if(acc)charge+=0.6;
    out.push({f,acc,glIn,glOut:M.gl&&GL.indexOf(i)>=0&&f>0&&LINE[i+1]>0,retrig:f>0&&!glIn,
      oct:(M.env/100)*4.2*(acc?1.35+charge*0.7:1)});
  }
  return out;
}
const tauOf=()=>0.025+Math.pow(M.dec/100,1.5)*0.6;
/* where the filter is (Hz) at time t inside the bar, following the same rules the sound uses */
function curve(P,n){
  const base=hzOf(M.cut),tau=tauOf(),pts=[];let since=99,oct=0;
  for(let i=0;i<16;i++){const p=P[i];if(p.retrig){since=0;oct=p.oct}
    for(let j=0;j<n;j++){const t=since+j/n*SD;pts.push(Math.min(14000,base*Math.pow(2,oct*Math.exp(-t/tau))))}
    since+=SD}
  return pts;
}
let playStep=-1;
function drawMov(){
  const c=$("#mov");if(!c||!c.clientWidth)return;const W=c.width=c.clientWidth*2,H=c.height=300,x=c.getContext("2d");
  const P=plan(),n=16,pts=curve(P,n),lo=Math.log2(60),hi=Math.log2(14000),y=f=>H-10-(Math.log2(f)-lo)/(hi-lo)*(H-30);
  x.clearRect(0,0,W,H);
  const sw=W/16;
  for(let i=0;i<16;i++){if(i===playStep){x.fillStyle="rgba(242,201,76,.12)";x.fillRect(i*sw,0,sw,H)}
    x.fillStyle="#22302f";x.fillRect(i*sw,0,1,H)}
  x.strokeStyle="#f2c94c";x.lineWidth=4;x.beginPath();
  pts.forEach((f,k)=>{const X=k/pts.length*W;k?x.lineTo(X,y(f)):x.moveTo(X,y(f))});x.stroke();
  x.setLineDash([8,8]);x.strokeStyle="#33474a";x.lineWidth=2;x.beginPath();x.moveTo(0,y(hzOf(M.cut)));x.lineTo(W,y(hzOf(M.cut)));x.stroke();x.setLineDash([]);
  $("#steps").innerHTML=P.map((p,i)=>`<i class="${!p.f?"r":p.acc?"a":p.glOut?"g":""}">${!p.f?"·":p.acc?"⭐":p.glOut?"〰":i+1}</i>`).join("");
}

function apply(){
  if(st.q==="move"){
    const e=$("#menvO"),d=$("#mdecO"),c=$("#mcutO");
    if(e)e.textContent=M.env<8?"כבוי":M.env<40?"קצת":M.env<75?"אסיד":"הרבה";
    if(d)d.textContent=M.dec<25?"בלופ קצר":M.dec<60?"בינוני":"וואאו ארוך";
    if(c)c.textContent=M.cut<25?"סגור":M.cut<55?"חצי":"פתוח";
    $("#macc").classList.toggle("on",M.acc);$("#mgl").classList.toggle("on",M.gl);
    drawMov();
    if(A.ctx){A.osc.type="sawtooth";A.flt.Q.setTargetAtTime(qOfR(M.res),A.ctx.currentTime,0.02)}
    return}
  document.querySelectorAll("#wave button").forEach(b=>b.classList.toggle("on",b.dataset.w===st.wave));
  const co=$("#cutO"),ro=$("#resO");
  if(co)co.textContent=st.cut<25?"עמום":st.cut<55?"חם":st.cut<80?"בהיר":"פתוח לגמרי";
  if(ro)ro.textContent=st.res<15?"בלי":st.res<50?"קצת ציוץ":st.res<80?"אסיד":"צווחה";
  drawSpec();
  if(A.ctx){A.osc.type=st.wave==="sq"?"square":"sawtooth";const t=A.ctx.currentTime;
    A.flt.frequency.cancelScheduledValues(t);A.flt.frequency.setTargetAtTime(cutHz(),t,0.02);A.flt.Q.setTargetAtTime(qOf(),t,0.02)}
}

/* ---------- the sound: one oscillator through the filter ---------- */
const A={};
function initAudio(){
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
  A.ctx=new C();A.osc=A.ctx.createOscillator();A.flt=A.ctx.createBiquadFilter();A.flt.type="lowpass";
  A.amp=A.ctx.createGain();A.amp.gain.value=0;const out=A.ctx.createGain();out.gain.value=0.35;
  A.osc.connect(A.flt);A.flt.connect(A.amp);A.amp.connect(out);out.connect(A.ctx.destination);A.osc.start();return true}
let timer=null,step=0,next=0,P=null;const marks=[];
function sched(){
  while(next<A.ctx.currentTime+0.12){const i=step%16;
    if(st.q==="move"){
      if(i===0)P=plan();const p=P[i],t=next;
      if(p.f){
        if(p.glIn){A.osc.frequency.setValueAtTime(LINE[i-1],t);A.osc.frequency.linearRampToValueAtTime(p.f,t+0.06)}
        else A.osc.frequency.setValueAtTime(p.f,t);
        if(p.retrig){const base=hzOf(M.cut);A.flt.frequency.cancelScheduledValues(t);
          A.flt.frequency.setValueAtTime(Math.min(14000,base*Math.pow(2,p.oct)),t);A.flt.frequency.setTargetAtTime(base,t,tauOf()*0.75)}
        if(!p.glIn){A.amp.gain.cancelScheduledValues(t);A.amp.gain.setValueAtTime(0,t);A.amp.gain.linearRampToValueAtTime(p.acc?1:0.72,t+0.004)}
        if(!p.glOut)A.amp.gain.setTargetAtTime(0,t+SD*0.6,0.03)}
      marks.push([t,i]);
    }else{const f=LINE[i];
      if(f){A.osc.frequency.setValueAtTime(f,next);A.amp.gain.cancelScheduledValues(next);A.amp.gain.setValueAtTime(0,next);
        A.amp.gain.linearRampToValueAtTime(1,next+0.004);A.amp.gain.setTargetAtTime(0,next+SD*0.55,0.03)}}
    step++;next+=SD}
  while(marks.length&&marks[0][0]<=A.ctx.currentTime){const m=marks.shift();if(m[1]!==playStep){playStep=m[1];drawMov()}}
}
function stop(){
  if(!timer)return;clearInterval(timer);timer=null;marks.length=0;playStep=-1;
  const t=A.ctx.currentTime;A.amp.gain.cancelScheduledValues(t);A.amp.gain.setTargetAtTime(0,t,0.02);
  const b=$("#playbtn");if(b){b.classList.remove("on");b.textContent="▶ להשמיע קו"}
  if(st.q==="move")drawMov();
}
function toggle(){
  if(!A.ctx&&!initAudio())return;if(A.ctx.state==="suspended")A.ctx.resume();
  if(timer){stop();return}
  apply();if(st.q!=="move"){A.flt.frequency.cancelScheduledValues(A.ctx.currentTime);A.flt.frequency.value=cutHz()}
  step=0;next=A.ctx.currentTime+0.05;P=null;sched();timer=setInterval(sched,25);
  const b=$("#playbtn");b.classList.add("on");b.textContent="■ לעצור";
}

/* ---------- tabs, sheets ---------- */
function go(v){st.tab=v;save();
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id==="v-"+v));
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
  if(v==="see")requestAnimationFrame(()=>{drawSpec();drawMov()})}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go(b.dataset.v));
const shade=$("#shade"),sheet=$("#sheet");
const closeSheet=()=>shade.classList.remove("on");
shade.onclick=e=>{if(e.target===shade)closeSheet()};
function soon(q){
  sheet.innerHTML=`<button class="x">✕ סגור</button><h2>${q.e} ${q.n}</h2><p class="lead">${q.q}</p>
<div class="box"><strong class="h">מי עונה על זה</strong>${q.who}</div>
<p class="back">השאלה הזו עוד לא בנויה. היא תיבנה בהמשך, אחת בכל פעם.</p>`;
  sheet.querySelector(".x").onclick=closeSheet;shade.classList.add("on")}
$("#help").onclick=()=>{
  sheet.innerHTML=`<button class="x">✕ סגור</button><h2>חמש השאלות</h2>
<p class="lead">כל צליל, מבס אסיד ועד כינור, מתפרק לחמש שאלות. כל כפתור בכל מכשיר עונה על אחת מהן.</p>
<div class="box" style="display:flex;flex-direction:column;gap:6px">${Q.map(q=>`<div class="qrow"><b>${q.e} ${q.n}</b><span>${q.q}</span></div>`).join("")}</div>
<div class="box"><strong class="h">איך לומדים שאלה</strong><ul><li>👀 לראות: הדמיה אחת שנוגעים בה ושומעים.</li><li>🎛️ לשחק: משימה של 5 דקות על המכשיר. כפתור אחד, מקשיבים, ונותנים שם למה שקרה.</li></ul></div>
<p class="back">אחרי חמש השאלות, כל צליל ששומעים אפשר לפרק לבד: ״כהה, קצר, זז מהר, קצת מלוכלך״, ולבנות אותו.</p>`;
  sheet.querySelector(".x").onclick=closeSheet;shade.classList.add("on")};
window.addEventListener("resize",()=>{drawSpec();drawMov()});

/* the screen stays on while the page is open (both hands are on the instrument) */
(()=>{if(!("wakeLock" in navigator))return;let lock=null;
  const get=()=>{if(lock||document.visibilityState!=="visible")return;navigator.wakeLock.request("screen").then(l=>{lock=l;l.addEventListener("release",()=>{lock=null})}).catch(()=>{})};
  document.addEventListener("visibilitychange",get);document.addEventListener("pointerdown",get,{once:true});get()})();

drawChips();drawSee();drawPlay();go(st.tab==="play"?"play":"see");
window.SOUND_TEST={st:()=>st,cutHz,qOf,plan};
</script>
