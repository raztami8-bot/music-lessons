     "אפשר גם לבחור אם התו מחזיק כל עוד לוחצים (החזקה), ואם המעטפת שולטת גם בעוצמה ולא רק במסנן."],
  tr:["קו שמנגן. {decay} מקצר לארוך.","{cutoff} לשעה 9, ו־{egint} לאט ימינה.","{attack} לשעה 10: התווים ״נבלעים״ בכניסה."],
  hear:"{decay} קובע גם את אורך התו וגם את אורך ה״וואו״, כי זו אותה מעטפת.",back:"חזרה: 🏠 הבית. החזקה ומעטפת על העוצמה: 🔎 לשלוף, ״צירופים״."},
 {sec:S2,t:"התנועה המחזורית: יד שלישית",ids:["rate","lfoint","func"],
  p:["LFO הוא מתנד איטי כל כך שלא שומעים אותו כצליל. במקום זה הוא מסובב כפתור בשבילך, הלוך וחזור, בלי להתעייף.",

     "יש לו שתי צורות: חלקה, שעולה ויורדת כמו גל, וקופצת, שמדלגת בין שני מצבים כמו מתג.",
     "ההבדל מהמעטפת: המעטפת מתחילה מחדש בכל תו. התנועה המחזורית רצה כל הזמן, ולכן כל תו פוגש אותה במקום אחר. מזה באה התחושה שהקו ״חי״."],
  tr:["קו שמנגן. התנועה על המסנן, {lfoint} לשעה 12.","{rate} לאט מאוד, ואז מהר.","מחליפים את היעד לגובה, ו־{lfoint} מעט מאוד."],
  hear:"לאט: הקו נפתח ונסגר על פני כמה תיבות. מהר: בעבוע.",back:"חזרה: {lfoint} עד הסוף שמאלה. היעד והצורה: 🔎 לשלוף, ״צירופים״."},
 {sec:S2,t:"גלישה",ids:["stepmode","func"],
  p:["בדרך כלל כל תו קופץ ישר לגובה שלו. בגלישה הגובה <b>נמרח</b> מהתו הקודם אליו, כמו אצבע שמחליקה על מיתר.",
     "בוולקה מסמנים גלישה לכל צעד בנפרד, ולכן אפשר לבחור: רוב הקו קופץ, ורק מעבר אחד או שניים נמרחים. זה מה שנותן לאסיד את ה״יללה״.",

  tr:["קו שיש בו קפיצה גדולה בין שני תווים.","מסמנים גלישה רק בצעד שאחרי הקפיצה.","מוסיפים עוד אחת, ומשווים."],

 {sec:S3,t:"בס אסיד",ids:["cutoff","peak","egint","decay"],set:H({cutoff:9,peak:2,egint:2}),
  p:["אסיד הוא לא תווים, הוא מסנן שזז. המתכון: גל מסור, מסנן די סגור, הרבה רזוננס, ומעטפת שפותחת אותו בכל תו.",
     "ואז שלושה דברים בקו עצמו: <b>גלישות</b>, <b>שתיקות</b>, וקפיצות אוקטבה. בלי אלה זה סתם בס עם מסנן.",
     "ואז מנגנים את הכפתורים: {cutoff} הוא ההגה, {peak} הוא כמה זה ״צועק״, {egint} כמה כל תו ״נפתח״, ו־{decay} כמה הוא ארוך. מזיזים אחד בכל פעם, לאט."],
  tr:["{cutoff} לשעה 9, {peak} לשעה 2, {egint} לשעה 2.","קו שמנגן: {cutoff} לאט למעלה ולמטה על פני ארבע תיבות.","כשהמסנן פתוח: {decay} ארוך."],
  hear:"ה״צרחה״ מגיעה כשהמסנן פתוח והרזוננס גבוה. לא חייבים להישאר שם.",back:"חזרה: 🏠 הבית."},
 {sec:S3,t:"בס עבה: שלושה כאחד",ids:["pitch1","pitch2","pitch3","cutoff"],set:H({cutoff:9}),
  p:["כששלושת המתנדים מקובצים ומנגנים את אותו תו, ושניים מהם מוזזים טיפה מהמרכז (אחד למעלה, אחד למטה), מתקבל בס רחב ועבה שממלא את החדר.",
     "כמה להזיז? עד שהצליל ״מסתובב״ לאט. אם הוא מתנדנד מהר או נשמע מזויף, זה יותר מדי.",
     "עוד אפשרות: מתנד אחד אוקטבה למטה. זה מוסיף ״קומה״ מתחת לבס, ונותן משקל בלי לשנות את הקו."],
  tr:["מקבצים את שלושת המתנדים יחד.","{pitch2} טיפה ימינה, {pitch3} טיפה שמאלה.","{pitch3} עד הסוף שמאלה: אוקטבה למטה."],
  hear:"קו של תו אחד נשמע פתאום כמו שלושה נגנים.",back:"קיבוץ: 🔎 לשלוף, ״צירופים״, ״קיבוץ המתנדים״. חזרה: שלושת ה־[PITCH] לשעה 12."},
 {sec:S3,t:"אקורד מקליד אחד",ids:["pitch1","pitch2","pitch3"],
  p:["כשמתנד 2 ומתנד 3 מכוונים לתווים אחרים ממתנד 1, כל קליד מנגן שלושה תווים יחד: אקורד. וכשהקו זז, כל האקורד זז איתו. זה הצליל של ״סטאב״ בטכנו ובהאוס.",
     "שני כיוונים שתמיד עובדים. <b>קווינטה</b>: מתנד אחד שבעה חצאי טונים מעל. נשמע פתוח, חזק ויציב. <b>מינור</b>: אחד שלושה חצאי טונים מעל ואחד שבעה. נשמע כהה ורגשי.",
     "מכוונים לפי האוזן: מסובבים לאט עד שהתו ״ננעל״ ומפסיק להתנדנד."],
  tr:["מקבצים את שלושתם. מנגנים תו ארוך.","{pitch2} ימינה עד שהוא ננעל על תו גבוה שמתאים.","מנגנים קו קצר של שלושה תווים עם {decay} קצר."],
  hear:"מכה קצרה של אקורד, כמו בתקליט טכנו ישן.",back:"חזרה: שלושת ה־[PITCH] לשעה 12."},
 {sec:S3,t:"שלושה קווים: שיחה",ids:["vco1","vco2","vco3","stepmode"],
  p:["כשהמתנדים נפרדים, לכל אחד יש רצף משלו. אחד מנגן בס נמוך, השני עונה לו באוקטבה למעלה, והשלישי מוסיף תו גבוה פעם בכמה צעדים.",
     "הסוד הוא ש<b>הם לא מנגנים יחד</b>. כשאחד מנגן, האחרים שותקים. ככה נוצרת שיחה, ולא גוש.",
     "ובג׳אם: משתיקים ומחזירים מתנדים. הקו מתחיל ממתנד אחד, נכנס שני, נכנס שלישי. זה פיתוח שלם בלי להחליף תבנית."],
  tr:["מפרידים את המתנדים. כותבים למתנד 1 ארבעה תווים על 1, 5, 9, 13.","למתנד 2: תווים רק על 3 ו־11.","משתיקים ומחזירים את מתנד 2 בזמן הנגינה."],
  hear:"שני קווים שמשלימים זה את זה נשמעים כמו קו אחד מסובך.",back:"השתקה וקיבוץ: 🔎 לשלוף, ״צירופים״."},
 {sec:S4,t:"קו בס: מעט תווים, הרבה קצב",ids:["rec","func","octave"],
  p:["קו טוב בנוי בדרך כלל משניים או שלושה תווים, לא משמונה. מה שהופך אותו למעניין הוא <b>איפה</b> הם נופלים ואיפה יש שקט.",
     "נקודת התחלה שתמיד עובדת: תו אחד (״תו הבית״), אותו תו אוקטבה למעלה, ותו אחד קרוב. האוזן שומעת את תו הבית כקרקע, ואת השאר כתנועה.",
     "<b>שתיקה היא תו</b>. צעד שקט נותן לקו לנשום ומשאיר מקום לקיק. קו בלי שתיקות נשמע כמו מכונת תפירה."],
  tr:["כותבים 16 צעדים: רק תו אחד, עם חמש או שש שתיקות.","מחליפים שני צעדים לאותו תו באוקטבה למעלה.","משווים: מה השתנה יותר, התווים או הקצב?"],
  hear:"אותו תו, קצב אחר, קו אחר לגמרי.",back:"איך כותבים: 🔎 לשלוף, ״צירופים״, ״לכתוב תווים, צעד אחרי צעד״."},
 {sec:S4,t:"הבס והקיק: מי איפה",ids:S([1,5,9,13]),
  p:["16 הקלידים הם תיבה אחת. 1, 5, 9, 13 הם הרבעים, ושם בדרך כלל יושב הקיק של מכונת התופים.",
     "קיק ובס חיים באותם תדרים נמוכים. כששניהם מנגנים באותו רגע, הם מתנגשים ונשמעים עכורים. הפתרון הפשוט ביותר: <b>הבס לא מנגן על הקיק</b>.",
     "בס שמנגן רק בין הקיקים (למשל 3, 4, 7, 8) הוא הבס של טראנס. בס שמנגן רק על האוף־ביט (3, 7, 11, 15) הוא בס של האוס וטכנו. שניהם משאירים את הקיק נקי."],
  tr:["מדליקים צעדים פעילים, ומכבים את 1, 5, 9, 13.","מקשיבים עם קיק ממכשיר אחר.","מחזירים אותם, ומשווים."],

 {sec:S4,t:"קו קצר: לופ שלא חוזר",ids:["play","func"],
  p:["קו לא חייב להיות 16. כשמכבים צעדים פעילים, הקו מתקצר. קו של 12 או 7 צעדים מעל תופים של 16 נופל כל סיבוב במקום אחר ביחס לקיק. זה נקרא <b>פולימטר</b>.",

  tr:["קו של 16 שמנגן עם תופים.","מכבים את ארבעת הצעדים האחרונים: קו של 12.","מקשיבים שמונה תיבות בלי לגעת."],

 {sec:S4,t:"מתח ושחרור: המסנן כמנצח",ids:["cutoff","peak","decay"],
