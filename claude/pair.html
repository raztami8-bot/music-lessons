<script>
"use strict";
/* The Crave and the Edge together, for doors.js. Both boards are drawn as one picture: the Crave on top, the Edge under it.
   Every id gets a prefix: c_ for the Crave, e_ for the Edge. The facts come from lesson 23 (stage 3 and 4) and from the two data files.
   What the manuals don't say is marked 🔍. */
const CR=window.CRAVE, ED=window.EDGE, CH=660, OFF=680, EH=640;
const MARK={c:" 🧡",e:" 💗"}, WHO={c:"בקרייב 🧡",e:"באדג׳ 💗"};
const P={names:{},info:{},areas:[]};
[["c",CR],["e",ED]].forEach(([p,X])=>{
  for(const k in X.names)P.names[p+"_"+k]=X.names[k]+MARK[p];
  for(const k in X.info)P.info[p+"_"+k]=X.info[k];
  X.areas.forEach(a=>P.areas.push([a[0],a[1].map(i=>p+"_"+i)]));
});
const inner=(s,p,y,h)=>s.replace(/data-id="/g,'data-id="'+p+'_').replace("<svg ",`<svg x="0" y="${y}" width="1000" height="${h}" `);
P.svg=`<svg viewBox="0 0 1000 ${OFF+EH}" direction="ltr" role="img" aria-label="הקרייב למעלה, האדג׳ למטה">`+
  inner(CR.svg,"c",0,CH)+
  `<text x="500" y="${CH+15}" style="font:800 14px Assistant,Arial,sans-serif;fill:#cbbcff;text-anchor:middle">▲ הקרייב 🧡 · האדג׳ 💗 ▼</text>`+
  inner(ED.svg,"e",OFF,EH)+`</svg>`;

/* who is what, for the sheet that opens on every name */
const SW={c:["shape","oscsrc","oscdest","vcfmode","vcfsrc","vcfpol","vcamode","susw","lfoshape"],e:["osc1shape","seqpitch","noisecolor","vcamode","osc2shape","hardsync","vcfsel","clock","scale"]};
const HE={};
Object.keys(P.names).forEach(id=>{const p=id[0],k=id.slice(2),inf=P.info[id]||"";
  HE[id]=[ /^j_/.test(k)?(inf.indexOf("יציאה")===0||/^היציאה/.test(inf)?"יציאה ":"כניסה ")+WHO[p]:WHO[p], /^j_|midi/.test(k)?"שקע":SW[p].indexOf(k)>=0?"מתג":"כפתור"]});

/* the home: each one at its own home (crave.html and edge.html), and one cable between them */
const CHOME={freq:12,pw:12,oscmod:7,mix:7,cutoff:12,reso:7,vcfmod:7,volume:9,attack:7,decay:12,sustain:7,lforate:12,glide:7};
const EHOME={osc1freq:9,osc1env:2,osc1lvl:3,egdec:10,osc2freq:12,osc2env:12,osc2lvl:7,fm:7,noise:7,cutoff:2,reso:7,vcfdec:12,vcfenv:12,noisevcf:7,vcadec:11,volume:9};
for(let i=1;i<=8;i++){EHOME["p"+i]=12;EHOME["v"+i]=2}
const HOME={},HOMESW={};
for(const k in CHOME)HOME["c_"+k]=CHOME[k];
for(const k in EHOME)HOME["e_"+k]=EHOME[k];
Object.entries({shape:"SAW",vcfmode:"LP",vcfsrc:"ENV",vcfpol:"+",vcamode:"ENV",susw:"OFF"}).forEach(([k,v])=>HOMESW["c_"+k]=v);
Object.entries({osc1shape:"TRI",seqpitch:"OFF",hardsync:"OFF",vcfsel:"LP",vcamode:"FAST",clock:"INT/EXT"}).forEach(([k,v])=>HOMESW["e_"+k]=v);
const H=o=>Object.assign({},HOME,o||{});

/* the setting that makes ASSIGN a clock, from lesson 23, card 4.1 */
const SETIN="{c_shift} + {c_holdrest} + {c_s8}, עוזבים. נורית 1 מהבהבת בצהוב: עמוד ההגדרות הראשון.";
const SYNC=["c_j_assign","e_j_adv","e_clock"];

const L=[

  hear:"בציור: הקרייב למעלה, האדג׳ למטה. כל שם על כפתור מסומן בלב של המכשיר שלו, 🧡 או 💗, כי הרבה שמות חוזרים בשניהם."},

  tr:["כבל הולך תמיד מיציאה לכניסה.","על הלוח: רקע שחור הוא יציאה, מסגרת היא כניסה.","הכבל: קצר, 3.5 מ״מ מונו, כמו בכבלים של כל אחד לבד."],

  hear:"מסובבים {c_tempo}: שניהם מאיצים יחד. {e_tempo} כבר לא עושה כלום.",

 {t:"כשהטי־8 בג׳אם: מידי במקום כבל",ids:["c_midiin","c_midithru","e_midiin","e_clock"],

  back:"את השרשרת המלאה, עם ההגדרה של הקרייב, יש בדף <a href=\"lesson-23.html#s2\">ביחד · שיעור 3, שלב 2</a>. כל הכבלים האחרים בדף הזה עובדים גם ככה."},

  b:"מהיציאות של האדג׳ ({e_j_vcaeg}, {e_j_pitchout}, {e_j_velout}, {e_j_trigout}) אל הכניסות של הקרייב. הבס מתחיל לזוז לפי המכות.",
  tr:["כבל: {e_j_vcaeg} אל {c_j_vcfcut}.","{c_cutoff} נמוך, לשעה 9."],
  hear:"בכל מכה של האדג׳ הבס נפתח לרגע ונסגר.",
  back:"שים לב: זה ההפך מסייד־צ׳יין. הבס נפתח במכה, הוא לא נחלש בה. את ה״נשימה״ ההפוכה, שהבס נעלם בכל קיק, הכבל הזה לא נותן."},
 {t:"כיוון שני: הבס מזיז את התופים",ids:["c_j_lfotri","e_j_vcadec","c_lforate"],set:H({c_lforate:9}),
  b:"מהיציאות של הקרייב ({c_j_lfotri}, {c_j_env}, {c_j_kbcv}, {c_j_gate}) אל הכניסות של האדג׳. הכי מעניין: ה־LFO, כי הוא זז לבד גם כשלא נוגעים.",
  tr:["כבל: {c_j_lfotri} אל {e_j_vcadec}.","{c_lforate} לאט, לשעה 9."],
  hear:"הקיק מתארך ומתקצר לאט, לבד. אותם שמונה צעדים, ובכל זאת זה לא נשמע קפוא."},

  tr:["{c_shift} + {c_arp} + {c_s7}, עוזבים. הרצף של הקרייב נגמר בצעד 7.","חזרה לרגיל: אותו צירוף עם {c_s8}."],
  hear:"שני קווים קצרים שנשמעים כמו קטע ארוך שלא חוזר על עצמו. 5 ו־6 נותנים תחושה אחרת."},
 {t:"עכשיו לשחק",b:"בלשונית לשחק יש משימות קצרות לכל כיוון: סנכרון, התופים מזיזים את הבס, הבס מזיז את התופים, אורכים, ולייב. כל משימה: כבל אחד או שניים.",
  back:"לפני כל משימה: שניהם בבית, ומסונכרנים. 🏠 למעלה מראה איך.",btn:["🎲 למשימה הראשונה","play"]}
];

const REC=[

 ["הבס נפתח בכל מכה","{e_j_vcaeg} ← {c_j_vcfcut}."],
 ["שורת PITCH מנגנת את המסנן","{e_j_pitchout} ← {c_j_vcfcut}, {e_seqpitch} על [OFF]."],
 ["האדג׳ מנגן קו בס","{e_j_pitchout} ← {c_j_osccv}, וגם {e_j_trigout} ← {c_j_envgate}. הסיקוונסר של הקרייב עצור."],
 ["הבס עובר דרך התופים","{c_j_saw} ← {e_j_ext}, ו־{e_noise} למעלה."],

 ["הבס מדליק את התופים","{c_j_gate} ← {e_j_play}. לא סנכרון, טריק לגיוון."]];
const FIX=[
 ["האדג׳ לא זז","כבל ב־{e_j_adv}? המתג {e_clock} על [INT/EXT]? הקרייב באמת מנגן?"],
 ["האדג׳ רץ מהר מדי או לא אחיד","הסיקוונסר שלו רץ גם לבד. עוצרים ב־{e_play}, ורק הכבל מקדם."],
 ["ASSIGN לא שולח כלום","ההגדרה בעמוד 2 של הקרייב אולי לא נשמרה. שוב: "+SETIN+" {c_step}, {c_s2}, ויוצאים."],
 ["הקרייב לא זז לפי השעון שלו","בהגדרות, עמוד 3, השעון צריך להיות ערך 1 (הקרייב עצמו). אם שינית ל־2 בשביל הטי־8, מחזירים."],

 ["הכל נשמע בלגן","מוציאים את כל הכבלים חוץ מהסנכרון, וחוזרים ל־🏠 הבית. מוסיפים כבל אחד בכל פעם."]];
const MORE=[["lesson-23.html#s3","ביחד · שיעור 3","הקרייב, האדג׳ והטי־8, עם כל הצעדים"],["crave.html","הקרייב 🧡","להכיר, לשלוף, לשחק"],["edge.html","האדג׳ 💗","להכיר, לשלוף, לשחק"],["connections.html","חיבורים","מיקסר ושרשרת מידי"]];

const M=[
 /* sync */
 {c:"sync",t:"מנצח אחד",d:["{c_j_assign} אל {e_j_adv}, מתג {e_clock} על [INT/EXT].","{c_play}. מסובבים {c_tempo} לאט מקצה לקצה.","מוצאים יחד מהירות שבה שניהם נשמעים הכי טוב."],ids:["c_j_assign","e_j_adv","e_clock","c_tempo"],from:"שניהם בבית, ASSIGN כבר על שעון"},
 {c:"sync",t:"התופים בחצי מהירות",d:[SETIN,"{c_step} פעם אחת, ואז {c_s3}: דפיקה כל שני צעדים. יוצאים.","{c_play}: האדג׳ מנגן לאט, מתחת לקו של הקרייב.","חזרה: אותה דרך, עם {c_s2}."],ids:["c_shift","c_holdrest","c_s8","c_step","c_s3"],from:"🏠 הבית, מסונכרנים",min:2},

 {c:"e2c",t:"האדג׳ מנגן את הבס",d:["{c_play}: הסיקוונסר של הקרייב עוצר. {e_seqpitch} על [OFF].","כבל: {e_j_pitchout} אל {c_j_osccv}.","כבל שני: {e_j_trigout} אל {c_j_envgate}. כבל הסנכרון יוצא.","עכשיו כל צעד של האדג׳ מנגן תו בקרייב. סובב את כפתורי PITCH: קו בס של 8 צעדים.","🔍 עובד? ספר לי."],ids:["e_j_pitchout","c_j_osccv","e_j_trigout","c_j_envgate","e_seqpitch"],from:"🏠 הבית",min:3},
 {c:"e2c",t:"הבס עובר דרך התופים",d:["כבל: {c_j_saw} אל {e_j_ext}.","{e_noise} לאט למעלה, ו־{e_osc1lvl} עד הסוף שמאלה.","הבס של הקרייב נחתך בכל מכה של האדג׳. שחק ב־{e_vcadec} וב־{e_cutoff}."],ids:["c_j_saw","e_j_ext","e_noise","e_osc1lvl","e_vcadec","e_cutoff"],set:H({e_osc1lvl:7}),from:"🏠 הבית, מסונכרנים"},
 {c:"e2c",t:"ציוץ בכל מכה",d:["כבל: {e_j_vcfeg} אל {c_j_oscfm}.","{e_vcfdec} קצר: ציוץ קטן. ארוך: גלישה.","מה שמעת? ספר לי."],ids:["e_j_vcfeg","c_j_oscfm","e_vcfdec"],from:"🏠 הבית, מסונכרנים"},
