<script>
"use strict";
/* The T-8 and the Volca Bass send, the Crave (״הכתום״) and the Edge (״הסגול״) receive. For doors.js, built like pair.html:
   only the two receivers are drawn (the Crave on top, the Edge under it), because the inputs are there. The senders' jacks are written as [LABELS].
   Every id gets a prefix: c_ for the Crave, e_ for the Edge. Facts: the two data files, the T-8 manual 1.02 (MIX IN/OUT need stereo cables,
   no audio device into SYNC OUT, S.cLk), and the Volca sync from lesson 13 (a tick every two steps). What was not tried on a device is in CHECKS. */
const CR=window.CRAVE, ED=window.EDGE, CH=660, OFF=680, EH=640;
const MARK={c:" 🧡",e:" 💗"}, WHO={c:"בכתום 🧡",e:"בסגול 💗"};
const P={names:{},info:{},areas:[]};
[["c",CR],["e",ED]].forEach(([p,X])=>{
  for(const k in X.names)P.names[p+"_"+k]=X.names[k]+MARK[p];
  for(const k in X.info)P.info[p+"_"+k]=X.info[k];
  X.areas.forEach(a=>P.areas.push([a[0],a[1].map(i=>p+"_"+i)]));
});
const inner=(s,p,y,h)=>s.replace(/data-id="/g,'data-id="'+p+'_').replace("<svg ",`<svg x="0" y="${y}" width="1000" height="${h}" `);
P.svg=`<svg viewBox="0 0 1000 ${OFF+EH}" direction="ltr" role="img" aria-label="הכתום למעלה, הסגול למטה">`+
  inner(CR.svg,"c",0,CH)+
  `<text x="500" y="${CH+15}" style="font:800 14px Assistant,Arial,sans-serif;fill:#cbbcff;text-anchor:middle">▲ הכתום 🧡 · הסגול 💗 ▼</text>`+
  inner(ED.svg,"e",OFF,EH)+`</svg>`;

/* who is what, for the sheet that opens on every name */
const SW={c:["shape","oscsrc","oscdest","vcfmode","vcfsrc","vcfpol","vcamode","susw","lfoshape"],e:["osc1shape","seqpitch","noisecolor","vcamode","osc2shape","hardsync","vcfsel","clock","scale"]};
const HE={};
Object.keys(P.names).forEach(id=>{const p=id[0],k=id.slice(2),inf=P.info[id]||"";
  HE[id]=[ /^j_/.test(k)?(inf.indexOf("יציאה")===0||/^היציאה/.test(inf)?"יציאה ":"כניסה ")+WHO[p]:WHO[p], /^j_|midi/.test(k)?"שקע":SW[p].indexOf(k)>=0?"מתג":"כפתור"]});

/* the home: each one at its own home (crave.html and edge.html), as in pair.html, and no cables at all */
const CHOME={freq:12,pw:12,oscmod:7,mix:7,cutoff:12,reso:7,vcfmod:7,volume:9,attack:7,decay:12,sustain:7,lforate:12,glide:7};
const EHOME={osc1freq:9,osc1env:2,osc1lvl:3,egdec:10,osc2freq:12,osc2env:12,osc2lvl:7,fm:7,noise:7,cutoff:2,reso:7,vcfdec:12,vcfenv:12,noisevcf:7,vcadec:11,volume:9};
for(let i=1;i<=8;i++){EHOME["p"+i]=12;EHOME["v"+i]=2}
const HOME={},HOMESW={};
for(const k in CHOME)HOME["c_"+k]=CHOME[k];
for(const k in EHOME)HOME["e_"+k]=EHOME[k];
Object.entries({shape:"SAW",vcfmode:"LP",vcfsrc:"ENV",vcfpol:"+",vcamode:"ENV",susw:"OFF"}).forEach(([k,v])=>HOMESW["c_"+k]=v);
Object.entries({osc1shape:"TRI",seqpitch:"OFF",hardsync:"OFF",vcfsel:"LP",vcamode:"FAST",clock:"INT/EXT"}).forEach(([k,v])=>HOMESW["e_"+k]=v);
const H=o=>Object.assign({},HOME,o||{});

/* the senders, in words */
const T8S="[SYNC OUT] של הטי־8", T8A="[MIX OUT] של הטי־8", VBS="[SYNC OUT] של הוולקה", VBA="[PHONES] של הוולקה";
const YC="כבל סטריאו";

const L=[
 {t:"שני שולחים, שני מקבלים",all:true,
  b:"הטי־8 והוולקה בס הם <b>השולחים</b>: יש להם יציאות. הכתום 🧡 והסגול 💗 הם <b>המקבלים</b>: יש להם הרבה כניסות. כבל אחד משולח למקבל, והמקבל מתחיל להגיב לשולח: מנגן בקצב שלו, מעביר את הצליל שלו דרך המסנן, או נוהם ומצלצל לפיו.",
  hear:"בציור רק הכתום והסגול, כי הכניסות אצלם. השקעים של הטי־8 והוולקה כתובים במילים, כמו [SYNC OUT]."},

  back:"לכל כניסה, מה דפיקה עושה לה ומה צליל עושה לה: לשלוף ← 🔀 דפיקה או צליל."},
 {t:"מתי הווליום משנה",
  b:"ה־[VOLUME] של השולח משנה רק צליל. לדפיקות אין ווליום.<br><br>⏱ דפיקה: הווליום לא משנה כלום. הדפיקות תמיד באותו חוזק.<br>🔊 צליל ← צליל: הווליום הוא כמה חזק הוא נכנס. חזק מאוד: מתעוות.<br>🔊 צליל ← שליטה: הווליום הוא העומק. באפס כלום, ולאט למעלה יותר ויותר רעד.<br>🔊 צליל ← הדק: הווליום הוא הסף. נמוך: כלום. בינוני: רק הקיק. גבוה: הכל.",
  back:"בכניסת שליטה גם הכפתור של המקבל משנה: הכניסה מוסיפה למה שהכפתור כבר קובע. {c_cutoff} פתוח עד הסוף לא משאיר מקום להיפתח, אז מתחילים איתו נמוך."},
 {t:"מה מהתבנית מגיע",
  b:"⏱ <b>דפיקה לא יודעת מה בתבנית.</b> היא יוצאת כל חצי פעמה, גם בצעד שקט וגם כשהבס שותק. מה שמשנה אותה: הקצב, ו־[S.cLk] בטי־8.<br><br>🔊 <b>צליל הוא התבנית עצמה.</b> כל מכה וכל תו שהשולח מנגן מגיעים למקבל, בדיוק במקום שלהם. צעד שקט: המקבל רגוע. מכה חזקה: המקבל קופץ.",
  hear:"לכן, כדי לשנות את הקצב של התגובה: בדפיקה משנים קצב, ובצליל משנים את התבנית בטי־8."},
 {t:"תופים או בס",
  b:"מ־[MIX OUT] של הטי־8 יוצאים התופים והבס יחד, ולכל אחד השפעה אחרת:<br><br>🥁 <b>תופים</b> הם מכות קצרות. המקבל קופץ בכל מכה ונרגע ביניהן. הקיק הכי חזק ונמוך, ולכן הוא שולט. ההיי־האטים קטנים וגבוהים, ונותנים זמזום דק. הסנר הוא רעש, ונותן חספוס.<br><br>🎸 <b>בס</b> הוא צליל ארוך עם גובה. המקבל זז כל הזמן, והתנועה משתנה עם כל תו. בשקעי המתכת ({c_j_oscfm}, {e_j_fmin}) כל תו של הבס נותן צלצול אחר.",
  tr:["רק הבס: בטי־8, [SHIFT] + הלחצן של כל תוף. התופים מושתקים.","רק התופים: [SHIFT] + הלחצן של הבס.","הוולקה בס שולחת תמיד רק בס."],
  back:"ההשתקה משתיקה גם את מה ששומעים במיקסר. ככה עושים ג׳אם: משתיקים ומחזירים, והמקבל משנה התנהגות."},

  hear:"ככה הכתום והסגול מנגנים בדיוק בקצב של הטי־8, בלי שום הגדרה."},

  b:"{c_j_ext} ו־{e_j_ext} הן כניסות צליל. מה שנכנס בהן תופס את המקום של הרעש, ועובר במסנן ובמגבר של המקבל.",
  tr:["בכתום: {c_mix} עד הסוף ימינה. {c_vcamode} על [ON], אחרת שומעים רק כשהכתום מנגן תו.","בסגול: {e_noise} למעלה. המגבר של הסגול נפתח רק במכה, ולכן הצליל נחתך לפי המכות שלו."],
  hear:"הטי־8 במסנן של הכתום: {c_cutoff} פותח וסוגר את כל התבנית, כמו דיג׳יי."},
 {t:"צליל: בשקע שמזיז משהו",ids:["c_j_vcfcut","c_j_oscfm","e_j_vcfmod","e_j_fmin"],

  tr:["{c_j_vcfcut}: הבס נוהם וקופץ בכל קיק.","{c_j_oscfm} או {e_j_fmin}: מתכת וצלצול.","{e_j_vcfmod}: חספוס. העומק ב־{e_noisevcf}."],

  tr:["לא מחברים יציאה ליציאה. תמיד יציאה אל כניסה. בציור: רקע שחור הוא יציאה, מסגרת היא כניסה.","לא מכניסים צליל לשקעי [SYNC] ו־[MIDI] של הטי־8 והוולקה. במדריך של הטי־8 כתוב במפורש לא לחבר מכשיר שמע ל־[SYNC OUT].","לא מחליפים ספקי כוח בין המכשירים."],

  back:"לפני כל משימה: הכתום והסגול בבית, בלי כבלים. 🏠 למעלה מראה איך.",btn:["🎲 למשימה הראשונה","play"]}
