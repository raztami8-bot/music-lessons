<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1920">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="האדג׳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>האדג׳ · להכיר, לשלוף, לשחק · גרסת קלוד</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* The Edge in three doors: learn (one card per screen), find (the board, row by row), play (one mission at a time).
   Phone first, one thumb. Same dark look as edge-guide.html. Board drawings are crops of the panel in edge-data.js. */
:root{
  --bg:#141116; --panel:#1d1920; --card:#25202a; --line:#3a3240;
  --fg:#f1ebf2; --muted:#b3a8b8; --magenta:#d63fa6; --magenta-soft:#3a1f33;
  --gold:#f2c94c; --green:#6fcf97;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;direction:rtl;
  display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.en{font-family:var(--mono);font-weight:600;font-size:.86em;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
button.en{background:var(--magenta-soft);border:1px solid #6d3359;border-radius:6px;padding:1px 6px;color:#ffd9f1}

/* top bar */
.bar{flex:0 0 auto;background:var(--panel);border-bottom:3px solid var(--magenta);padding:calc(var(--st) + 8px) 14px 8px;
  display:flex;align-items:center;gap:10px}
.bar a{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 2px}
.bar h1{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0;flex:1;text-align:center;line-height:1}
.homebtn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.9rem}

/* views */
main{flex:1 1 auto;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 18px}
.inner{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* bottom tabs */
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-top:1px solid var(--line);
  padding:6px 8px calc(var(--sb) + 6px)}
.tabs button{background:none;border:0;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-weight:700;font-size:.92rem}
.tabs button span{font-size:1.35rem;line-height:1.1}
.tabs button[aria-selected="true"]{background:var(--magenta);color:#fff}

/* board crops */
.crops{display:flex;flex-direction:column;gap:8px}
.crop{background:#d6299a;border-radius:12px;padding:5px;overflow:hidden}
.crop svg{display:block;width:100%;height:auto;border-radius:8px;background:#141414}
.edgei .hl{fill:none;stroke:none}
.edgei .hit{fill:transparent}
.edgei .ctl{cursor:pointer}
.dim .ctl:not(.on){opacity:.38}
.edgei .ctl.on .hl{fill:rgba(242,201,76,.2);stroke:var(--gold);stroke-width:3.5}
.edgei .ctl.pick .hl{fill:rgba(111,207,151,.25);stroke:var(--green);stroke-width:4}
.edgei .ptr{transition:transform .35s ease}

/* learn */
.prog{display:flex;gap:4px;padding:10px 14px 0;max-width:708px;margin:0 auto;width:100%}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.d{background:var(--magenta)}
.count{font-family:var(--mono);font-size:.78rem;color:var(--magenta);letter-spacing:.06em}
h2{font-family:var(--display);font-weight:400;font-size:1.55rem;margin:0;line-height:1.2;text-wrap:balance}
.lead{margin:0;font-size:1.06rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.box strong.h{display:block;font-size:.82rem;color:var(--magenta);letter-spacing:.02em;margin-bottom:3px}
.box ol,.box ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:5px}
.hear{background:var(--magenta-soft);border-color:var(--magenta)}
.back{color:var(--muted);font-size:.93rem;margin:0}
.navrow{flex:0 0 auto;display:flex;gap:10px;padding:8px 14px 10px;max-width:708px;margin:0 auto;width:100%}
.navrow button{flex:1;border-radius:999px;padding:13px 10px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.navrow .next{background:var(--magenta);border-color:var(--magenta);color:#fff;flex:2}
.navrow button:disabled{opacity:.35}
.big{align-self:stretch;border-radius:14px;padding:14px;font-weight:700;font-size:1.05rem;background:var(--magenta);border:0;color:#fff}
.ghost{align-self:flex-start;border-radius:999px;padding:9px 14px;font-weight:700;background:none;border:1px solid var(--magenta)}

/* find */
.chips{flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;background:var(--panel);border-bottom:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:.95rem;padding:9px 14px;border-radius:999px}
.chip[aria-selected="true"]{background:var(--magenta);border-color:var(--magenta);color:#fff}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--fg);font:inherit}
.band{direction:ltr;overflow-x:auto;background:#d6299a;border-radius:12px;padding:5px;-webkit-overflow-scrolling:touch}
.band svg{display:block;border-radius:8px;background:#141414}
.hint{color:var(--muted);font-size:.88rem;margin:-4px 0 0}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;flex-direction:column;gap:3px;text-align:start;width:100%}
.row.pick{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.row .he{color:var(--magenta);font-weight:700}
.row .kind{font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 7px}
.row p{margin:0}
.opts{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.opts li{display:flex;gap:9px;align-items:baseline;font-size:.96rem}
.opts b{font-family:var(--mono);font-weight:600;font-size:.8rem;background:var(--magenta-soft);color:#ffd1ee;border-radius:5px;padding:1px 7px;direction:ltr;unicode-bidi:isolate;flex:0 0 auto;min-width:3.4em;text-align:center}
.athome{font-size:.86rem;color:var(--gold)}
.links{display:flex;flex-direction:column;gap:8px}
.links a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--fg);text-decoration:none;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.links a small{color:var(--muted);font-weight:400}
h3{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:6px 0 0}

/* play */
.tag{align-self:flex-start;font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 11px;background:var(--magenta-soft);border:1px solid var(--magenta)}
.from{font-size:.9rem;color:var(--gold);margin:0}
.playrow{flex:0 0 auto;display:flex;gap:8px;padding:8px 14px 10px;max-width:708px;margin:0 auto;width:100%}
.playrow button{border-radius:999px;padding:13px 10px;font-weight:700;border:1px solid var(--line);background:var(--card);flex:1}
.playrow .dice{background:var(--magenta);border-color:var(--magenta);color:#fff;flex:1.6}
.playrow .ok.on{background:#1f3a2b;border-color:var(--green);color:var(--green)}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums}
.timer.run{border-color:var(--gold);color:var(--gold)}
.timer.end{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.tally{color:var(--muted);font-size:.86rem;margin:0;text-align:center}

/* sheet */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;align-items:flex-end;justify-content:center}
.shade.on{display:flex}
.sheet{background:var(--panel);border-radius:18px 18px 0 0;border-top:3px solid var(--magenta);width:100%;max-width:720px;max-height:88%;
  overflow-y:auto;padding:14px 14px calc(var(--sb) + 18px);display:flex;flex-direction:column;gap:12px}
.sheet .x{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700}
.grp{display:flex;flex-direction:column;gap:6px}
.sw{margin:0;font-size:.97rem}
.dials{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem;color:var(--muted)}
.dials b{color:var(--gold);font-weight:700}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
@media (min-width:700px){body{font-size:18px}.crops{flex-direction:row;flex-wrap:wrap}.crops .crop{flex:1 1 260px;max-width:460px}.sheet .crops .crop{max-width:none}}
@media (prefers-reduced-motion:reduce){.edgei .ptr{transition:none}}
</style>
</head>
<body>

<div class="bar">
  <a href="index.html">→ כל המכשירים</a>
  <h1>האדג׳</h1>
  <button class="homebtn" id="homebtn">🏠 הבית: קיק</button>
</div>

<main>
  <section class="view" id="v-learn">
    <div class="prog" id="prog"></div>
    <div class="scroll" id="learnScroll"><div class="inner" id="learn"></div></div>
    <div class="navrow"><button id="prev">→ הקודם</button><button class="next" id="next">הבא ←</button></div>
  </section>
  <section class="view" id="v-find">
    <div class="chips" id="chips" role="tablist"></div>
    <div class="scroll" id="findScroll"><div class="inner" id="find"></div></div>
  </section>
  <section class="view" id="v-play">
    <div class="chips" id="cats" role="tablist"></div>
    <div class="scroll" id="playScroll"><div class="inner" id="play"></div></div>
    <div class="playrow"><button class="timer" id="timer">⏱ דקה</button><button class="ok" id="ok">✓ עשיתי</button><button class="dice" id="dice">🎲 עוד משימה</button></div>
  </section>
</main>

<nav class="tabs" role="tablist">
  <button data-v="learn"><span>🌱</span>להכיר</button>
  <button data-v="find"><span>🔎</span>לשלוף</button>
  <button data-v="play"><span>🎲</span>לשחק</button>
</nav>

<div class="shade" id="shade"><div class="sheet" id="sheet"></div></div>

<script src="edge-data.js"></script>
<script>
"use strict";
const E=window.EDGE, $=s=>document.querySelector(s);
const st=(()=>{try{return JSON.parse(localStorage.getItem("edge2"))||{}}catch(e){return {}}})();
const save=()=>{try{localStorage.setItem("edge2",JSON.stringify(st))}catch(e){}};

/* ---------- the home: where every knob points for a plain kick (lesson 1, card 5.1). 7 = all the way left ---------- */
const HOME={osc1freq:9,osc1env:2,osc1lvl:3,egdec:10,osc2freq:12,osc2env:12,osc2lvl:7,fm:7,noise:7,cutoff:2,reso:7,vcfdec:12,vcfenv:12,noisevcf:7,vcadec:11,volume:9};
for(let i=1;i<=8;i++){HOME["p"+i]=12;HOME["v"+i]=2}
const HOMESW={osc1shape:"TRI",seqpitch:"OFF",hardsync:"OFF",vcfsel:"LP",vcamode:"FAST",clock:"INT/EXT"};
const hour=h=>h===7?"עד הסוף שמאלה":h===5?"עד הסוף ימינה":"שעה "+h;

/* ---------- Hebrew name, kind, switch positions ---------- */
const HE={
 osc1freq:["תדר","כפתור"],osc2freq:["תדר","כפתור"],
 osc1shape:["צורת גל","מתג",[["PULSE","מרובע: חד ומזמזם"],["TRI","משולש: רך ועגול"]]],
 osc2shape:["צורת גל","מתג",[["PULSE","מרובע: חד ומזמזם"],["TRI","משולש: רך ועגול"]]],
 osc1env:["מעטפת גובה","כפתור, אפס באמצע"],osc2env:["מעטפת גובה","כפתור, אפס באמצע"],
 seqpitch:["לאן הולכת שורת הגובה","מתג",[["VCO 1&2","לשני המתנדים: כל המכה זזה"],["VCO 2","רק למתנד 2: הגוף נשאר, הצלצול מנגן"],["OFF","לאף אחד: כל הצעדים באותו גובה"]]],
 osc1lvl:["עוצמת מתנד 1","כפתור"],osc2lvl:["עוצמת מתנד 2","כפתור"],
 egdec:["דעיכת הגובה","כפתור"],
 noisecolor:["צבע הרעש","מתג",[["WHITE","לבן: בהיר וחד"],["PINK","ורוד: כהה ורך"]]],
 noise:["כמות רעש","כפתור"],led:["נורית","נורית"],
 vcamode:["כניסת המכה","מתג",[["FAST","חדה, עם קליק"],["SLOW","רכה, בלי קליק"]]],
 vcadec:["אורך המכה","כפתור"],volume:["עוצמה כללית","כפתור"],
 hardsync:["נעילת מתנדים","מתג",[["ON","מתנד 2 ננעל על מתנד 1: שריקה חדה"],["OFF","כל אחד חופשי"]]],
 fm:["מתכת","כפתור"],
 vcfsel:["סוג המסנן","מתג",[["LP","חותך גבוהים: עמום ועמוק"],["HP","חותך נמוכים: דק וחד"]]],
 cutoff:["כמה המסנן פתוח","כפתור"],reso:["שריקה","כפתור"],vcfdec:["סגירת המסנן","כפתור"],
 vcfenv:["מעטפת המסנן","כפתור, אפס באמצע"],noisevcf:["רעש שמנענע את המסנן","כפתור"],
 tempo:["קצב","כפתור"],
 clock:["מי קובע את הקצב","מתג",[["INT/EXT","האדג׳ עצמו, או כבל ב־ADV/CLOCK"],["MIDI","השקע העגול, למשל הטי־8"],["USB","מחשב"]]],
 scale:["אורך צעד","כפתור"],trigger:["הקשה","לחצן"],play:["נגן / עצור","לחצן"],advance:["צעד קדימה","לחצן"],
 midiin:["כניסת מידי","שקע עגול"],midiout:["יציאת מידי","שקע עגול"]
};
for(let i=1;i<=8;i++){HE["p"+i]=["גובה של צעד "+i,"כפתור, אפס באמצע"];HE["v"+i]=["עוצמה של צעד "+i,"כפתור"]}
const he=id=>HE[id]||[E.info[id]&&E.info[id].indexOf("יציאה")===0?"יציאה":"כניסה","שקע"];

/* ---------- text helpers: {id} becomes the name on the board, a button that opens that control ---------- */
const nm=id=>`<button class="en" data-c="${id}">${E.names[id]}</button>`;
const tx=s=>s.replace(/\{(\w+)\}/g,(m,id)=>E.names[id]?nm(id):m).replace(/\[([^\]]+)\]/g,'<span class="en">$1</span>');
const V=[1,2,3,4,5,6,7,8].map(i=>"v"+i), P=[1,2,3,4,5,6,7,8].map(i=>"p"+i);

/* ---------- board crops ---------- */
const tpl=document.createElement("template"); tpl.innerHTML=E.svg;
const BASE=tpl.content.firstElementChild;
BASE.querySelectorAll(".ctl").forEach(g=>{const c=g.querySelector("circle"),l=[...g.querySelectorAll("line")].filter(x=>x.getAttribute("stroke-width")==="3").pop();
  if(c&&l&&HOME[g.dataset.id]!==undefined){l.classList.add("ptr");l.style.transformOrigin=c.getAttribute("cx")+"px "+c.getAttribute("cy")+"px";}});
const BOX={};
BASE.querySelectorAll(".ctl").forEach(g=>{const r=g.querySelector(".hit");BOX[g.dataset.id]=[+r.getAttribute("x"),+r.getAttribute("y"),+r.getAttribute("width"),+r.getAttribute("height")]});
/* step numbers: under every VEL knob, and the PITCH box grows up to the number printed above it */
for(let i=1;i<=8;i++){const v=BOX["v"+i],p=BOX["p"+i],x=v[0]+v[2]/2;
  BASE.insertAdjacentHTML("beforeend",`<text x="${x}" y="612" class="l" style="fill:#f2c94c;font-size:14px">${i}</text>`);
  v[3]=618-v[1];const top=396;p[3]+=p[1]-top;p[1]=top}
function union(ids){let a=1e9,b=1e9,c=-1e9,d=-1e9;ids.forEach(i=>{const r=BOX[i];if(!r)return;a=Math.min(a,r[0]);b=Math.min(b,r[1]);c=Math.max(c,r[0]+r[2]);d=Math.max(d,r[1]+r[3])});return [a,b,c,d]}
const band=id=>{const y=BOX[id][1]+BOX[id][3]/2;return y<150?0:y<272?1:y<392?2:y<520?3:4};
function clusters(ids){
  ids=ids.filter(i=>BOX[i]);
  const rows={};ids.forEach(i=>{(rows[band(i)]=rows[band(i)]||[]).push(i)});
  let out=[];
  const split=g=>{g.sort((x,y)=>BOX[x][0]-BOX[y][0]);const u=union(g);if(u[2]-u[0]<=450||g.length<2)return [g];
    let best=1,bg=-1;const mid=(g.length)/2;
    for(let i=1;i<g.length;i++){const gap=BOX[g[i]][0]-(BOX[g[i-1]][0]+BOX[g[i-1]][2]);if(gap>bg+1||(Math.abs(gap-bg)<=1&&Math.abs(i-mid)<Math.abs(best-mid))){bg=gap;best=i}}
    return split(g.slice(0,best)).concat(split(g.slice(best)))};
  Object.keys(rows).sort().forEach(k=>{out=out.concat(split(rows[k]))});
  /* the two knobs of one step sit in two bands: put a PITCH group and the VEL group under it in one picture */
  for(let i=0;i<out.length;i++)for(let j=i+1;j<out.length;j++){const a=union(out[i]),b=union(out[j]);
    if(Math.abs(a[0]-b[0])<30&&Math.abs(a[2]-b[2])<30&&Math.abs(a[1]-b[1])<200){out[i]=out[i].concat(out[j]);out.splice(j,1);j--}}
  return out;
}
function setKnobs(svg,set){svg.querySelectorAll(".ptr").forEach(l=>{const id=l.closest(".ctl").dataset.id,h=set&&set[id];l.style.transform=h?`rotate(${(h%12)*30}deg)`:""})}
function cropSvg(ids,set,minW){
  const s=BASE.cloneNode(true),u=union(ids),pad=26;minW=minW||290;
  let x=u[0]-pad,y=u[1]-pad,w=u[2]-u[0]+2*pad,h=u[3]-u[1]+2*pad;
  if(w<minW){x-=(minW-w)/2;w=minW} if(h<120){y-=(120-h)/2;h=120}
  x=Math.max(0,Math.min(x,1000-w));y=Math.max(0,Math.min(y,640-h));
  s.setAttribute("viewBox",[x,y,w,h].join(" "));s.classList.add("dim");
  ids.forEach(i=>{const g=s.querySelector(`.ctl[data-id="${i}"]`);if(g)g.classList.add("on")});
  setKnobs(s,set);return s;
}
function crops(ids,set){
  const box=document.createElement("div");box.className="crops";
  let cl=clusters(ids);
  if(cl.length>3){const d=document.createElement("div");d.className="crop";const s=BASE.cloneNode(true);s.classList.add("dim");
    ids.forEach(i=>{const g=s.querySelector(`.ctl[data-id="${i}"]`);if(g)g.classList.add("on")});setKnobs(s,set);d.appendChild(s);box.appendChild(d);return box}
  if(cl.length===2)box.classList.add("two");
  cl.forEach(g=>{const d=document.createElement("div");d.className="crop";d.appendChild(cropSvg(g,set));box.appendChild(d)});
  return box;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-c]");if(b){openCtl(b.dataset.c);return}
  const g=e.target.closest(".crop .ctl");if(g)openCtl(g.dataset.id);
});

/* ---------- sheet ---------- */
const shade=$("#shade"),sheet=$("#sheet");
function openSheet(build){sheet.innerHTML='<button class="x">✕ סגור</button>';build(sheet);shade.classList.add("on");sheet.scrollTop=0}
shade.addEventListener("click",e=>{if(e.target===shade||e.target.closest(".x"))shade.classList.remove("on")});
function ctlHtml(id){
  const h=he(id);let s=`<div class="top"><span class="en">${E.names[id]}</span><span class="kind">${h[1]}</span></div><div class="he">${h[0]}</div><p>${E.info[id]||""}</p>`;

const pool=()=>M.map((m,i)=>i).filter(i=>cat==="all"||M[i].c===cat);
function roll(){
  if(!bag.length){bag=pool().filter(i=>i!==mi);const fresh=bag.filter(i=>!st.done[i]);if(fresh.length)bag=fresh;
    for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}
  if(bag.length)mi=bag.pop();drawPlay();
}

$("#timer").onclick=()=>{const b=$("#timer");if(tick||b.classList.contains("end")){stopTimer();return}
  let s=(M[mi].min||1)*60;const show=()=>{b.textContent="⏱ "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};b.classList.add("run");show();
  tick=setInterval(()=>{s--;if(s<=0){clearInterval(tick);tick=null;b.className="timer end";b.textContent="✓ נגמר הזמן"}else show()},1000)};

function drawPlay(keep){
  if(mi===undefined||!M[mi]||(cat!=="all"&&M[mi].c!==cat)){mi=undefined;roll();return}
  const m=M[mi],el=$("#play");el.innerHTML="";st.mi=mi;save();if(!keep)stopTimer();
  [...$("#cats").children].forEach(b=>b.setAttribute("aria-selected",b.dataset.k===cat));
  el.insertAdjacentHTML("beforeend",`<span class="tag">${CN[m.c]}</span><h2>${m.t}</h2><p class="from">מתחילים מ: ${tx(m.from||"🏠 הבית")}</p>`);
  if(m.ids)el.appendChild(crops(m.ids,m.set));
  el.insertAdjacentHTML("beforeend",`<div class="box"><ol>${m.d.map(x=>`<li>${tx(x)}</li>`).join("")}</ol></div>`);
  if(m.back)el.insertAdjacentHTML("beforeend",`<p class="back">חזרה: ${tx(m.back)}</p>`);
  const p=pool(),n=p.filter(i=>st.done[i]).length;
  el.insertAdjacentHTML("beforeend",`<p class="tally">עשית ${n} מתוך ${p.length}</p>`);
  const ok=$("#ok");ok.classList.toggle("on",!!st.done[mi]);ok.textContent=st.done[mi]?"✓ נעשה":"✓ עשיתי";
  if(!keep)$("#playScroll").scrollTop=0;
}

/* ---------- tabs ---------- */
function go(v){st.tab=v;save();
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id==="v-"+v));
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
  if(v==="learn")drawLearn();else if(v==="find")drawFind();else drawPlay();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go(b.dataset.v));
go(/^#(learn|find|play)$/.test(location.hash)?location.hash.slice(1):(st.tab||"learn"));
