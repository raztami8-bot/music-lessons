  hear:"״צ׳ק״ קצר מעל הקיק."},
 {sec:S1,t:"FM ומתכת",ids:["osc2freq","osc2lvl","fm","hardsync"],set:Object.assign({},HOME,{osc2lvl:12,fm:12}),
  p:["<b>FM</b> פירושו שמתנד אחד מזיז את הגובה של מתנד אחר, מהר מאוד, כמה מאות פעמים בשנייה. האוזן כבר לא שומעת ״תנועה״, אלא תדרים חדשים שלא היו באף אחד מהם: צלצול, פעמון, מתכת.",
     "באדג׳ {fm} קובע כמה מתנד 2 מזיז את מתנד 1. מה שקובע את הצבע הוא <b>היחס</b> בין הגבהים. יחס פשוט (אותו גובה, או כפול) נשמע מוזיקלי, כמו פעמון. יחס ״עקום״ נשמע כמו ברזל, פח, טכנו תעשייתי.",
     "{hardsync} הוא קרוב משפחה: מתנד 2 נאלץ להתחיל מחדש בכל פעם שמתנד 1 מתחיל. התוצאה: שריקה חדה ש״נקרעת״ כשמזיזים את {osc2freq}."],
  tr:["{fm} לשעה 12. סובב {osc2freq} לאט מקצה לקצה, ועצור בכל מקום שנשמע מעניין.","{hardsync} על [ON], ושוב {osc2freq}."],
  hear:"יש נקודות שנשמעות ״נקיות״ ונקודות ״מלוכלכות״. אלה היחסים."},

 {sec:S2,t:"מעטפת: איך צליל נולד ומת",ids:["egdec","vcfdec","vcadec","vcamode"],
  p:["<b>מעטפת</b> (Envelope, EG) היא תנועה אוטומטית שמתחילה בכל מכה: עולה ויורדת. בסינתיסייזר רגיל יש לה ארבעה שלבים (Attack, Decay, Sustain, Release). בתוף צריך רק שניים: כניסה מהירה ודעיכה.",
     "הסוד של האדג׳: <b>שלוש</b> מעטפות שעובדות יחד. {egdec} מפיל את הגובה (ה״בום״ של הקיק). {vcfdec} סוגר את המסנן (״וואו״). {vcadec} מוריד את העוצמה (כמה ארוכה המכה). {vcamode} קובע אם הכניסה חדה עם קליק, או רכה.",
     "רוב ההבדל בין קיק, טום, סנר ומכה ״מוזרה״ הוא היחס בין שלוש הדעיכות האלה."],
  tr:["כל [DECAY] לבד, מקצר לארוך, והשאר במקום.","שלושתם קצרים יחד, ואז שלושתם ארוכים יחד."],
  hear:"קצרים: טיק. ארוכים: בום שנמרח. באמצע: תוף."},
 {sec:S2,t:"מתח: השפה של הכבלים",ids:["j_vcadec","j_vcaeg","j_osc1cv"],
  p:["כל כפתור על הלוח הוא בעצם מתח חשמלי. כשמסובבים אותו, המתח עולה או יורד, והחלק שהוא מחובר אליו משתנה. זה נקרא <b>CV</b> (Control Voltage, מתח שליטה).",
     "שקע כניסה הוא ״כפתור נוסף״ שמתח מבחוץ מסובב. המתח שנכנס <b>מתווסף</b> למה שהכפתור כבר קובע, ולכן כבל לא עושה כלום אם הכפתור כבר בקצה.",
     "שלושה סוגים עוברים בכבלים. <b>״עכשיו!״</b> (Gate, Trigger): דפיקה קצרה שאומרת מתי. <b>הוראה שזזה</b> (CV): עולה ויורדת לאט או מהר, כמו יד על כפתור. <b>צליל</b> (Audio): מה ששומעים. ובאדג׳ אפשר לערבב: גם צליל יכול להזיז כפתור."],
  tr:["כבל מ־{j_vcaeg} אל {j_osc1cv}: המעטפת של העוצמה מזיזה עכשיו גם את הגובה."],
  hear:"מכה שנשמעת אחרת, בלי לגעת באף כפתור."},
 {sec:S2,t:"שורת הצעדים כמקור תנועה",ids:["seqpitch","j_pitchout","j_velout","p1","v1"],
  p:["שמונה הצעדים הם לא רק ״מתי לנגן״. כל שורה היא רצף של מתחים: שורת [PITCH] נותנת מתח לכל צעד, ושורת [VEL] נותנת מתח אחר.",
     "בלי כבל: [PITCH] משנה את הגובה (לפי {seqpitch}), ו־[VEL] את העוצמה. עם כבל מ־{j_pitchout} או {j_velout}, השורה הופכת ל״יד״ שמסובבת כל כפתור אחר, צעד אחרי צעד.",
     "זה הרעיון של מכשירים מודולריים: הסיקוונסר לא חייב לנגן תווים. הוא יכול לנגן מסנן, אורך, רעש או מתכת."],
  tr:["{seqpitch} על [OFF]. כבל מ־{j_pitchout} אל {j_vcadec}.","סובב כפתורי [PITCH] שונים: כל צעד מקבל אורך משלו."],
  hear:"אותו תוף, אבל כל צעד ״מדבר״ אחרת. זה גרוב."},
 {sec:S2,t:"תנועה איטית בלי LFO",ids:["osc2freq","j_osc2","j_vcfmod","noisevcf"],
  p:["<b>LFO</b> הוא מתנד איטי מדי לשמיעה, שמשמש רק להזיז דברים: מסנן שנפתח ונסגר, גובה שרועד. באדג׳ אין LFO, אבל יש שתי דרכים.",
     "הראשונה: מתנד 2 בתדר נמוך מאוד, דרך {j_osc2}, הוא כמעט LFO. 🔍 בדוק כמה נמוך הוא יורד אצלך. השנייה: שורת הצעדים, שהיא בעצם LFO ״מצויר ביד״ של 8 צעדים.",
     "ואם הקרייב מחובר, יש לו LFO אמיתי. בדף ״קרייב + אדג׳״ יש משימות שבהן ה־LFO שלו מזיז את האדג׳."],
  tr:["כבל מ־{j_osc2} אל {j_vcfmod}, {noisevcf} לשעה 12.","{osc2freq} עד הסוף שמאלה, ואז לאט ימינה."],
  hear:"בהתחלה תנועה, ואחר כך נהמה. הגבול ביניהם הוא איפה ש״תנועה״ הופכת ל״צליל״."},

 {sec:S3,t:"קיק לטכנו ולטראנס",ids:["osc1freq","osc1shape","osc1env","egdec","vcadec","noise"],set:Object.assign({},HOME,{osc1freq:8,osc1env:3,egdec:10,vcadec:12}),
  p:["קיק טוב הוא שלושה חלקים: <b>קליק</b> קצר בהתחלה (שומעים אותו גם ברמקול קטן), <b>בום</b> שהגובה שלו צונח, ו<b>זנב</b> נמוך.",
     "טכנו: קיק עגול וארוך יותר. {osc1shape} על [TRI], {osc1freq} נמוך, {vcadec} באמצע. טראנס ופסיכדלי: קיק <b>קצר והדוק</b>, כי הבס מתגלגל מיד אחריו ואסור להם לדרוך אחד על השני. {vcadec} ו־{egdec} קצרים יותר.",
     "הקליק: {osc1env} גבוה עם {egdec} קצר מאוד, או מעט {noise}."],
  tr:["התחל מהבית. {osc1freq} לשעה 8, {osc1env} לשעה 3.","{egdec} מ־9 עד 12: מצא איפה ה״בום״ נשמע הכי חזק.","{vcadec}: ארוך לטכנו, קצר לפסיכדלי."],
  hear:"קיק קצר משאיר ״חור״ אחריו. שם הבס יושב."},
 {sec:S3,t:"טום, קונגה ובלופ",ids:["osc1freq","reso","cutoff","vcfenv","p3","seqpitch"],
  p:["אותו מבנה כמו קיק, רק גבוה יותר וקצר יותר. טום: {osc1freq} בין 11 ל־1. קונגה: עוד יותר גבוה, {vcadec} קצר מאוד.",
     "בלופ אסיד: מעט {reso} ו־{vcfenv} גבוה. כל מכה ״מדברת״, כמו טיפה של בס אסיד. בשורת [PITCH] אפשר לתת לכל צעד גובה אחר, ופתאום יש מנגינה קטנה של תופים.",
     "הטריק של מכונות תופים: צליל אחד, גבהים שונים, נשמע כמו סט שלם."],
  tr:["{seqpitch} על [VCO 1&2].","שלושה צעדים גבוהים בשורת [PITCH], וה־[VEL] שלהם חלש."],
  hear:"קיק וטומים, מקול אחד."},
 {sec:S3,t:"סנר והיי־האט",ids:["noise","vcfsel","cutoff","vcadec","osc1lvl"],set:Object.assign({},HOME,{noise:3,osc1lvl:12,vcadec:9}),
  p:["<b>סנר</b> הוא שני דברים יחד: גוף (מתנד בגובה בינוני, קצר) ורעש (השרשרת שמתחת לתוף). {osc1freq} לשעה 12, {noise} גבוה, {vcadec} קצר.",
     "<b>היי־האט</b> הוא כמעט רק רעש, גבוה וקצר מאוד. {osc1lvl} לאפס, {vcfsel} על [HP], {cutoff} גבוה, {vcadec} הכי קצר. היי־האט פתוח: אותו דבר, רק {vcadec} ארוך יותר.",
     "באדג׳ הם לא יכולים לנגן באותו זמן עם הקיק, כי זה קול אחד. ולכן האדג׳ מצוין לשכבה ״מוזרה״ מעל מכונת תופים אחרת."],
  tr:["{osc1lvl} לאפס, {noise} למעלה, {vcfsel} על [HP].","{vcadec} מהקצר ביותר עד שעה 11."],
  hear:"״טס״ סגור, ואז ״צסססס״ פתוח."},
 {sec:S3,t:"מתכת ותעשייה",ids:["fm","osc2freq","hardsync","vcfsel","reso"],set:Object.assign({},HOME,{osc2lvl:12,fm:1}),
  p:["טכנו תעשייתי ודארק בנויים על צלילים שלא נשמעים כמו תוף ״אמיתי״: פח, צינור, שרשרת.",
     "המתכון: {fm} גבוה, {osc2freq} ביחס ״עקום״, {vcfsel} על [HP] כדי להוריד את הבום, וקצת {reso}. {vcadec} קצר לטיק מתכתי, ארוך לגונג.",
     "גיוון: אותו צליל בכל צעד, אבל שורת [PITCH] משנה רק את מתנד 2 ({seqpitch} על [VCO 2]). הגוף נשאר, והמתכת ״מנגנת״."],
  tr:["{fm} לשעה 1, {osc2freq} עד שנשמע פח.","{seqpitch} על [VCO 2], וסובב כפתורי [PITCH]."],
  hear:"מקצב של ברזל."},
 {sec:S3,t:"טקסטורה ודרון",ids:["vcamode","vcadec","tempo","scale","noise"],
  p:["לא כל צליל צריך להיות מכה. כשהמכות ארוכות יותר מהמרווח ביניהן, הן נמרחות זו לתוך זו, ונוצר משטח שזז: טקסטורה.",
     "{vcamode} על [SLOW], {vcadec} עד הסוף, {tempo} מהיר. עם קצת {noise} ומסנן סגור, זה נשמע כמו רוח או מכונה רחוקה. עם [PITCH] שונה בכל צעד, זה מנגינה שנמסה.",
     "בטראנס פסיכדלי ובפורסט, שכבות כאלה מתחת לקיק נותנות את התחושה ״החיה״ של היער."],
  tr:["{vcamode} על [SLOW], {vcadec} עד הסוף ימינה.","{tempo} מהיר, ו־{cutoff} נמוך."],
  hear:"אין יותר ״מכות״. יש גל."},

 {sec:S4,t:"מקום בתדרים",
  p:["כשכמה כלים מנגנים יחד, הם מתחרים על אותו מקום. אם הקיק והבס יושבים באותם תדרים נמוכים, הם מתערבבים לבוץ.",
     "שלוש דרכים לפנות מקום. <b>בזמן</b>: הקיק קצר, והבס מנגן בין הקיקים. ככה עובד הבס המתגלגל של טראנס. <b>בגובה</b>: כל כלי בטווח משלו. קיק נמוך, בס מעליו, מתכת והיי־האט למעלה. <b>במסנן</b>: [HP] על כל מה שלא צריך להיות נמוך.",
     "במיקסר יש EQ לכל ערוץ: להוריד את ה־LOW בערוצים שאינם קיק או בס עושה הבדל גדול."],
  hear:"מיקס ״נקי״ הוא לא עניין של עוצמה. כל כלי פשוט נמצא במקום אחר."},
 {sec:S4,t:"גרוב: עוצמה היא קצב",ids:["v1","v2","v3","v4","v5","v6","v7","v8"],
  p:["שני קצבים עם אותן מכות בדיוק יכולים להרגיש שונה לגמרי, רק בגלל העוצמה. מכה חזקה בפעמה ומכות חלשות ביניהן גורמות לגוף לזוז.",
     "<b>אקסנט</b>: מכה אחת חזקה יותר. <b>גוסט נוט</b>: מכה כל כך חלשה שכמעט לא שומעים אותה, אבל מרגישים. ב־[VEL] של האדג׳ זה מעבר אחד של כפתור.",
     "באדג׳ [VEL] גבוה הופך את המכה גם לארוכה ובהירה יותר, כך שעוצמה משנה גם את הצבע."],
  tr:["כל [VEL] לשעה 12, חוץ מ־{v1} ו־{v5} שעד הסוף ימינה.","עכשיו {v4} ו־{v8} לשעה 9: גוסטים."],
  hear:"אותן 8 מכות. הרבה יותר תנועה."},
 {sec:S4,t:"אורך הצעד ומשקל",ids:["scale","clock"],
  p:["{scale} קובע כמה זמן נמשך כל צעד מתוך התיבה. ב־1/16 שמונת הצעדים חוזרים פעמיים בכל תיבה. ב־1/8 הם נמתחים על תיבה שלמה. המספרים עם T הם <b>שלישונים</b>: שלוש מכות במקום שתיים.",
     "שלישונים מעל קיק ישר הם מה שנותן לגרוב ״גלגול״, ובטראנס ובפסיכדלי הם מקור לתחושת ריחוף.",
     "ומה קורה כשאורך הסיבוב לא מתחלק בתיבה? המקצב ״זז״ מול השאר. זה פולימטר, ויש עליו משימות בדף ״קרייב + אדג׳״."],
  tr:["{clock} על [MIDI] מהטי־8, ו־{scale} בין 1/16 לשלישון של 1/8."],
  hear:"אותו דפוס, הרגשה אחרת לגמרי."},
 {sec:S4,t:"מתח ושחרור",ids:["cutoff","fm","vcadec","noise"],
  p:["קטע מוזיקלי חי על מתח ושחרור. <b>מתח</b>: משהו נבנה, נפתח, מתגבר, והגוף מחכה. <b>שחרור</b>: הקיק חוזר, הכל נופל למקום.",
     "דרכים לבנות מתח על האדג׳: לפתוח {cutoff} לאט לאורך 8 או 16 תיבות, להכניס {fm} בהדרגה, להאריך {vcadec}, להוסיף {noise}. דרך לשחרר: להחזיר הכל למקום בבת אחת, בדיוק בתחילת תיבה.",
     "כלל: שינויים גדולים קורים בתחילת קבוצות של 4, 8 או 16 תיבות. ככה כל הרוקדים מרגישים אותם יחד."],
  tr:["ספור 8 תיבות, ובזמן הזה פתח את {cutoff} מלמטה עד למעלה.","בתחילת התיבה התשיעית, החזר אותו למקום בתנועה אחת."],
  hear:"השחרור מרגיש חזק בדיוק כמו שהמתח היה ארוך."},

 {sec:S5,t:"מונחים שחוזרים על עצמם",
  p:["המילים האלה מופיעות על כל סינתיסייזר, לא רק על האדג׳. מי שמכיר אותן, מבין לוח חדש תוך דקות."],
  rows:[["VCO · מתנד","מייצר את הרעידה הבסיסית. V.C. בהתחלה: ״נשלט במתח״, כלומר כבל יכול להזיז אותו."],
   ["VCF · מסנן","חותך חלק מהתדרים. Cutoff: איפה. Resonance: כמה ״שורק״ בנקודה הזו."],
   ["VCA · מגבר","קובע את העוצמה. בלי פקודה, הוא סגור ולא עובר צליל."],
   ["EG / ENV · מעטפת","תנועה אוטומטית שמתחילה בכל תו או מכה. Attack: כניסה. Decay: דעיכה. Sustain: החזקה. Release: שחרור."],
   ["LFO","מתנד איטי שלא שומעים, שמזיז דברים אחרים."],
   ["CV · מתח שליטה","מתח שעובר בכבל ומסובב כפתור מרחוק."],
   ["Gate / Trigger","״עכשיו!״. Trigger הוא דפיקה קצרה, Gate נמשך כל עוד התו מוחזק."],
   ["FM","מתנד אחד מזיז מהר את הגובה של אחר. נותן מתכת ופעמונים."],
   ["Hard Sync","מתנד אחד מכריח אחר להתחיל מחדש. נותן שריקה ״קרועה״."],
   ["Modulation · מודולציה","כל מצב שבו דבר אחד מזיז דבר אחר."],
   ["Patch · פאץ׳","כל הכבלים והכפתורים של צליל אחד. ״לפאצ׳״: לחבר כבלים."],
   ["Semi-modular","יש חיבורים נסתרים בפנים, כך שהוא מנגן בלי כבלים. כבל משנה או מוסיף על החיבורים האלה."],
   ["Sequencer · סיקוונסר","מנגן רצף צעדים לבד, שוב ושוב."],
