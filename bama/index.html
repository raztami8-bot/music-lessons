<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="במה">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>במה · לוח הופעה חיה</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app" data-tab="clips">
<header class="top">
  <h1>במה</h1>
  <button class="btn play" id="play" type="button" aria-pressed="false" aria-label="נגן">▶</button>
  <div class="grp"><button class="btn sq" id="bpmDown" type="button" aria-label="האט">−</button><span class="num" id="bpmVal">134</span><button class="btn sq" id="bpmUp" type="button" aria-label="האץ">+</button></div>
  <select class="btn sel" id="key" aria-label="טוניקה"></select>
  <button class="btn" id="sync" type="button" aria-pressed="false">⇄<span class="lg"> סנכרון</span></button>
  <button class="btn rec" id="rec" type="button" aria-pressed="false">⏺<span class="lg"> הקלט</span></button>
  <span class="barc" id="barc" dir="ltr">1.1</span>
</header>
<section class="lanes" dir="ltr" aria-hidden="true"><div class="lane" id="laneB"></div><div class="lane" id="laneD"></div></section>
<nav class="tabs" id="tabs"><button class="btn" data-t="clips" type="button" aria-pressed="true">קליפים</button><button class="btn" data-t="fx" type="button" aria-pressed="false">אפקטים</button></nav>
<main class="panels">
  <section class="panel clips">
    <div class="grid" id="grid" dir="ltr">
      <span class="rl">BASS</span><button class="btn clip" data-p="b" data-i="0">A</button><button class="btn clip" data-p="b" data-i="1">B</button><button class="btn clip" data-p="b" data-i="2">C</button><button class="btn clip" data-p="b" data-i="3">D</button>
      <span class="rl">DRUMS</span><button class="btn clip" data-p="d" data-i="0">A</button><button class="btn clip" data-p="d" data-i="1">B</button><button class="btn clip" data-p="d" data-i="2">C</button><button class="btn clip" data-p="d" data-i="3">D</button>
    </div>
    <div class="mutes" id="mutes" dir="ltr">
      <button class="btn mute" data-m="kick">KICK</button><button class="btn mute" data-m="clap">CLAP</button><button class="btn mute" data-m="hats">HATS</button><button class="btn mute" data-m="bass">BASS</button>
    </div>
    <div class="mem"><span class="cap">זיכרון</span><div class="memb" id="mem" dir="ltr"><button class="btn m">1</button><button class="btn m">2</button><button class="btn m">3</button><button class="btn m">4</button></div></div>
    <div class="bd"><button class="btn build" id="build" type="button" aria-pressed="false">BUILD ↗</button><button class="btn drop" id="drop" type="button">DROP ⤓</button></div>
    <p class="tip">קליף מתחלף בתחילת התיבה הבאה. לחיצה ארוכה על קליף בס = קו חדש. השתקה: לחיצה. סולו: לחיצה ארוכה. זיכרון: לחיצה ארוכה שומרת, לחיצה מחזירה.</p>
  </section>
  <section class="panel fx">
    <div class="xy" id="xy" dir="ltr"><span class="ax ax-x">LP ← FILTER → HP</span><span class="ax ax-y">DELAY + REVERB ↑</span><i id="dot"></i></div>
    <div class="holds" dir="ltr"><button class="btn hold" id="stut">STUTTER</button><button class="btn hold" id="throw">THROW</button><button class="btn hold" id="wash">WASH</button><button class="btn hold" id="tape">TAPE STOP</button></div>
    <div class="knobs" dir="ltr">
      <label><bdi>ENERGY</bdi><input type="range" id="energy" min="0" max="100" value="55"></label>
      <label><bdi>CUTOFF</bdi><input type="range" id="cutoff" min="0" max="100" value="45"></label>
      <label><bdi>RESONANCE</bdi><input type="range" id="res" min="0" max="100" value="60"></label>
      <label><bdi>DRIVE</bdi><input type="range" id="drive" min="0" max="100" value="25"></label>
      <label><bdi>VOLUME</bdi><input type="range" id="vol" min="0" max="100" value="80"></label>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
</div>
<script src="sync.js"></script>
<script src="bass.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
